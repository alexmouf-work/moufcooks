<style>
/* Plan. Subject: a family cookbook; reader: a home cook at the hob, phone propped up; job: read and follow a recipe.
   Layout: a deco facade. Symmetric and centred, stepped silhouettes for anything that holds a picture, vertical piers
   beside the name, one sunburst behind the featured photo. That sunburst is the one bold thing; all else is quiet.
   A recipe is a book of pages turned with arrows, never a long scroll.
   Type: Josefin Sans for titles (geometric, like lettering cut into a 1930s building), Literata for reading.
   Colour: oxblood red and brass on warm ivory.
   Motion: calm and premium. One curve, three durations, one drawn-in moment on arrival; the rest answers a tap. */
:root {

  --shade: 74 50 30;

  --body: Literata, Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.4, 0, .2, 1); --quick: 160ms; --std: 320ms; --slow: 560ms;
  --s: 14px;
  interpolate-size: allow-keywords;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E1A16; --surface: #29241F; --band: #25201B; --ink: #F3EEE6; --ink-2: #DCD3C6; --muted: #B5A898;
  --accent: #9B2C3A; --accent-ink: #EAA6AB; --accent-deep: #2B0F13; --on-accent: #FFFFFF; --foot-ink: #DCC7C4;
  --brass: #C9B27C; --brass-ink: #DCC48D; --line: #40382F; --photo: #332C25; --photo-ink: #A39481; --video: #14110E;
  --shade: 0 0 0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1E1A16; --surface: #29241F; --band: #25201B; --ink: #F3EEE6; --ink-2: #DCD3C6; --muted: #B5A898;
  --accent: #9B2C3A; --accent-ink: #EAA6AB; --accent-deep: #2B0F13; --on-accent: #FFFFFF; --foot-ink: #DCC7C4;
  --brass: #C9B27C; --brass-ink: #DCC48D; --line: #40382F; --photo: #332C25; --photo-ink: #A39481; --video: #14110E;

.stepped-top { clip-path: polygon(0 calc(2*var(--s)), var(--s) calc(2*var(--s)), var(--s) var(--s), calc(2*var(--s)) var(--s), calc(2*var(--s)) 0, calc(100% - 2*var(--s)) 0, calc(100% - 2*var(--s)) var(--s), calc(100% - var(--s)) var(--s), calc(100% - var(--s)) calc(2*var(--s)), 100% calc(2*var(--s)), 100% 100%, 0 100%); }

/* ---- masthead / footer (home) ---- */
.topbar { height: 8px; background: var(--accent); }

.foot .wrap { padding-block: 38px 44px; display: grid; justify-items: center; gap: 10px; }

/* ---- plain pages: privacy policy, terms of use ---- */
.doc { max-width: 42em; margin-inline: auto; padding-block: 28px 8px; }

.doc h1 { font-family: var(--title); font-weight: 600; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.1; letter-spacing: .03em; margin: 10px 0 18px; }

.doc h2 { font-family: var(--title); font-weight: 600; font-size: 1.45rem; letter-spacing: .03em; line-height: 1.2; margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--brass); }
.doc a { text-underline-offset: .2em; overflow-wrap: anywhere; }

/* ---- buttons ---- */
.btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: .2em 30px 0; font-family: var(--title); border: 0; background: none; cursor: pointer; text-decoration: none; color: var(--on-accent); font-weight: 600; font-size: 1.25rem; letter-spacing: .02em; transition: transform var(--quick) var(--ease); }

.btn:hover::before { filter: brightness(1.15); }

.btn svg { flex: none; width: 22px; height: 22px; margin-top: -.2em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }

.chip { min-height: 48px; padding: .2em 22px 0; font-family: var(--title); border: 1.5px solid var(--accent-ink); border-radius: 0; background: var(--surface); color: var(--accent-ink); cursor: pointer; font-size: 1.0625rem; font-weight: 600; letter-spacing: .03em; transition: background var(--std) var(--ease), color var(--std) var(--ease), transform var(--quick) var(--ease); }
.chip:active { transform: scale(.97); }

/* ---- photo slots ---- */
.ph { display: grid; place-items: center; align-content: center; gap: 8px; aspect-ratio: 4 / 3; max-width: 100%; background-color: var(--photo); color: var(--muted); font-size: 1rem; text-align: center; }
.ph svg { width: 36px; height: 36px; stroke: var(--photo-ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.ph.video svg { stroke: #F3EEE6; width: 46px; height: 46px; }
.frame { padding: 2px; background: var(--brass); }
.frame > div { padding: 10px; background: var(--surface); }
.lift { filter: drop-shadow(0 14px 16px rgb(var(--shade) / .2)); }

/* ---- home ---- */
.hero { background: var(--band); border-bottom: 1px solid var(--brass); }

.hero .shot { flex: 1 1 380px; min-width: 0; }
.kind { font-family: var(--title); font-weight: 600; font-size: 1.05rem; letter-spacing: .03em; padding-top: .2em; color: var(--brass-ink); }

.book { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.book > .wrap { width: 100%; }

.bar a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding-top: .2em; font-family: var(--title); font-weight: 600; font-size: 1.0625rem; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }
.bar a svg { width: 18px; height: 18px; margin-top: -.2em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }
.bar a:hover svg { transform: translateX(-4px); }
.bar .t { flex: 1; text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--title); font-weight: 600; font-size: 1.15rem; padding-top: .2em; color: var(--muted); }
.prog { padding-block: 12px 4px; display: grid; gap: 8px; }

.prog .lbl span { flex: none; }

.ticks { display: flex; gap: 4px; align-items: flex-end; height: 14px; }

/* Every page of a recipe is the same box: the full stage. A page that holds more than fits scrolls inside it. */
.page { align-self: stretch; height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; width: 100%; max-width: 1080px; margin-inline: auto; padding-block: 20px 28px; }
.pager { background: var(--surface); border-top: 1px solid var(--brass); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.pager .wrap { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.pager .btn { min-height: 62px; font-size: 1.3rem; }
.pager .next { justify-content: space-between; text-align: left; }
.pager .next .nt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--body); font-weight: 400; font-size: 1.0625rem; letter-spacing: 0; text-transform: none; opacity: .9; padding-bottom: .2em; }
@media (max-width: 640px) { .pager .wrap { grid-template-columns: 1fr 1fr; } .pager .next .nt { display: none; } .pager .next { justify-content: center; } }

.cover { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 52px; }
.cover .copy { flex: 1 1 400px; min-width: 0; display: grid; gap: 14px; justify-items: start; }
.cover .shot { flex: 1 1 340px; min-width: 0; }
@media (min-width: 641px) and (max-width: 860px) { .cover .shot .ph { aspect-ratio: 5 / 2; } }
@media (max-width: 640px) { .cover { gap: 14px; } .cover .copy { gap: 10px; } .cover .shot { order: -1; } .cover .shot .ph { aspect-ratio: 5 / 2; } .cover .frame > div { padding: 6px; } .cover h1 { font-size: 2.1rem; } .cover .orn { display: none; } .lede { font-size: 1.1rem; line-height: 1.5; } .serv .note { display: none; } .steppage { gap: 14px; } .steppage { display: flex; flex-direction: column; } .steppage .side { order: -1; } .num { width: 46px; height: 46px; font-size: 1.35rem; } .page { padding-block: 12px 16px; } }
.serv { display: grid; gap: 6px; width: min(100%, 420px); padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--brass); }
.serv .lbl { display: flex; align-items: baseline; gap: 10px; font-family: var(--title); font-weight: 600; font-size: 1.15rem; padding-top: .2em; }

@keyframes pop { 0% { transform: translateY(6px); opacity: .2; } 100% { transform: none; opacity: 1; } }

.serv .note { font-size: 1rem; color: var(--muted); min-height: 1.6em; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: relative; border: 1.5px solid var(--accent-ink); background: var(--surface); padding: 3px; }

.pagehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 40px; padding-bottom: 18px; }
.pagehead .serv { padding-block: 8px 6px; }
.pagehead .serv .note { display: none; }
.pagehead h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); }
.needcols { columns: 3 270px; column-gap: 44px; }

.needcols { font-size: 1.125rem; line-height: 1.45; }

.needcols input:checked + span { color: var(--muted); background-size: 100% 1.5px; }
.needcols .q { font-weight: 600; }

.steppage { position: relative; display: grid; gap: 22px 52px; align-items: start; }

// The "why" drops down from its button across the whole page, and stops at the bottom of the screen.
function toggleWhy(open) {
  const btn = app.querySelector(".whybtn"), drop = document.getElementById("why");
  if (!btn || !drop || open === drop.classList.contains("open")) return;
  btn.setAttribute("aria-expanded", open);
  if (open) {
    const room = app.querySelector(".stage").getBoundingClientRect().bottom - btn.getBoundingClientRect().bottom - 20;
    let top = btn.offsetTop + btn.offsetHeight + 10, el = btn.offsetParent;
    while (el && !el.classList.contains("steppage")) { top += el.offsetTop; el = el.offsetParent; }
    drop.style.top = top + "px";
    drop.style.maxHeight = Math.max(room, 180) + "px";
  } else drop.style.maxHeight = "";
  drop.classList.toggle("open", open);
}
function turn(d) {
  const { view, r } = route();
  if (view !== "recipe") return;
  const i = Math.min(at(r), pages(r).length - 1), n = Math.min(Math.max(i + d, 0), pages(r).length - 1);
  if (n === i) return;
  at(r, n);
  change(() => { render(); const st = app.querySelector(".stage");  }, d < 0 ? "back" : "fwd");
}
function setPeople(r, p) {
  const [min, max] = range(r);
  p = Math.min(Math.max(p, min), max);
  if (p === people(r)) return;
  store.set("people-" + r.slug, p);
  const box = app.querySelector(".serv");
  if (!box) return;
  const b = box.querySelector("b"), input = box.querySelector("input");
  b.textContent = p; b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick");
  input.value = p; input.style.setProperty("--fill", ((p - min) / (max - min)) * 100 + "%");
  box.querySelector(".note").textContent = p === r.base ? "As the recipe is written." : "Amounts are reworked for you. Cooking times stay the same.";
  const list = app.querySelector(".needcols");
  if (list) list.innerHTML = needList(r, list.dataset.part.split(",").map(Number));
}

let lastView = route().view;
addEventListener("hashchange", () => {
  const next = route();
  if (lastView === "home") homeScroll = scrollY;
  change(() => { render(); scrollTo(0, next.view === "home" ? homeScroll : 0); });
  lastView = next.view;
});
app.addEventListener("click", (e) => {
  if (e.target.closest("[data-theme-toggle]")) {
    const next = theme() === "dark" ? "light" : "dark";
    change(() => { document.documentElement.dataset.theme = next; store.set("theme", next); app.querySelectorAll("[data-theme-toggle]").forEach((b) => { b.outerHTML = themeBtn(); }); });
    return;
  }
  const chip = e.target.closest("[data-kind]");
  if (chip) { kind = chip.dataset.kind; change(render); return; }
  const ver = e.target.closest("[data-ver]");
  if (ver) {
    store.set("version", ver.dataset.ver);
    const seg = ver.closest(".seg");
    seg.dataset.v = ver.dataset.ver;
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === ver));
    return;
  }
  const pm = e.target.closest("[data-pm]");
  if (pm) { const { r } = route(); setPeople(r, people(r) + +pm.dataset.pm * range(r)[2]); return; }
  const go = e.target.closest("[data-go]");
  if (go) { turn(+go.dataset.go); return; }
  const why = e.target.closest(".whybtn");
  if (why) { toggleWhy(why.getAttribute("aria-expanded") !== "true"); return; }
  if (!e.target.closest(".whydrop")) toggleWhy(false);
});
app.addEventListener("input", (e) => { if (e.target.id === "people") setPeople(route().r, +e.target.value); });
app.addEventListener("change", (e) => {
  if (!e.target.matches(".needcols input")) return;
  const { r } = route();
  const seen = [...app.querySelectorAll(".needcols input")].map((c) => +c.dataset.i);
  const kept = store.get("ticks-" + r.slug, []).filter((i) => !seen.includes(i));
  store.set("ticks-" + r.slug, kept.concat([...app.querySelectorAll(".needcols input:checked")].map((c) => +c.dataset.i)));
});
addEventListener("keydown", (e) => {
  if (e.target.matches && e.target.matches("input[type=range]")) return;
  if (e.key === "Escape") toggleWhy(false);
  else if (e.key === "ArrowRight") turn(1); else if (e.key === "ArrowLeft") turn(-1);
});
let sx = null, sy = 0;
app.addEventListener("pointerdown", (e) => { sx = e.target.closest(".stage") && !e.target.closest("input, button, summary, label") ? e.clientX : null; sy = e.clientY; });
app.addEventListener("pointerup", (e) => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
});
addEventListener("resize", () => { if (route().view === "recipe") render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && route().view === "recipe") keepAwake(); });
render();
</script>
