<script>
const RECIPES = [{"slug": "beef-cheek-ragu", "title": "Beef cheek ragù", "intro": "A rich, slow-braised ragù of beef cheek, red wine and tomato, with roasted bone marrow folded through at the end. The cheeks cook until they fall apart at a touch.", "kind": "Italian", "line": "Slow-braised beef cheek in red wine and tomato, with roasted bone marrow.", "time": "About 7 hours", "serves": "Serves 6–8", "base": 6, "unit": "people", "groups": [{"name": "The meat", "items": ["1.25 kg beef cheeks, trimmed (about 3 cheeks)", "12 g fine sea salt (1% of the meat's weight; about 2 level teaspoons)", "About 1 kg <strong>marrow bones, cut into 5–7 cm rounds<\/strong> or split lengthways. Ask the butcher to cut them (see <em>Bones<\/em>).", "1 tbsp neutral oil, if the marrow gives little fat"]}, {"name": "The base", "items": ["150 g pancetta, finely diced", "20 g butter", "2 onions (about 300 g), 2 carrots (about 200 g) and 2 celery sticks (about 150 g)", "5 garlic cloves", "3 tbsp tomato purée (double concentrate)"]}, {"name": "The braise", "items": ["500 ml dry red wine: medium-bodied and not oaky, such as Chianti, Montepulciano d'Abruzzo, Barbera or Côtes du Rhône", "2 × 400 g tins whole plum tomatoes (San Marzano if you can find them)", "400–600 ml beef stock, homemade or good shop-bought fresh stock (not cubes)", "2 bay leaves, 4 sprigs thyme and 1 small sprig rosemary, tied together", "6–8 whole black peppercorns (optional)", "1 Parmesan rind"]}, {"name": "To finish", "items": ["30 g cold butter", "1 tsp red wine vinegar or a lemon", "Black pepper"]}], "steps": [{"n": 1, "phase": "Salt and bones", "title": "Salt the cheeks", "text": "<p>Check for any shiny, silvery membrane left on the outside and slice it off. Sprinkle the 12 g of salt evenly over every side.<\/p><ul><li><strong>Standard:<\/strong> halve each cheek first, so the halves are about equally thick. Leave them uncovered for <strong>one hour<\/strong>, at room temperature or in the fridge.<\/li><li><strong>Elevated:<\/strong> keep them whole. Leave them uncovered on a rack in the fridge overnight.<\/li><\/ul>", "why": "<p><strong>Halves for the standard version:<\/strong> Six pieces have far more surface to brown than three, and that browning becomes flavour in the sauce. They also soften a little sooner. Don't go smaller than halves: small chunks dry out and turn stringy before the collagen melts. <strong>The hour:<\/strong> In the first 20–40 minutes, salt pulls moisture to the surface, which then steams instead of browning. By an hour most of it has been drawn back in, carrying the seasoning with it. So sear either straight after salting or after the full hour, never in between.<\/p>"}, {"n": 2, "phase": "Salt and bones", "title": "Roast the marrow bones", "text": "<p>Roast the marrow bones, cut side up, at 200 °C fan (220 °C conventional) for about 20 minutes, until the marrow is soft and just starting to bubble. Pour off the rendered fat and keep it. Scoop out <strong>about half the marrow<\/strong> with a teaspoon, then cover it and refrigerate. The rest stays in the bones. Turn the oven down to <strong>130 °C fan (150 °C conventional)<\/strong>.<\/p>", "why": "<p>Roasting gives the bones a deep, nutty flavour that raw bones don't have. Marrow is used twice: the half left in the bones melts into the sauce over the long cook and gives depth, and the reserved half goes in at the very end so it tastes clearly of marrow. Much more than 20 minutes and the marrow melts away into the tin.<\/p>"}, {"n": 3, "phase": "One pan: vegetables, searing, the braise", "title": "Render the pancetta, then soften the vegetables", "text": "<p>Dice the onions, carrots and celery to 5 mm, and slice the garlic. Put the pancetta in the casserole over a medium-low heat with <strong>a dash of water<\/strong> (2–3 tbsp). Let the water cook off and the fat run, then let the pancetta crisp. Add the butter, onion, carrot, celery and a pinch of salt, and cook gently for 15–20 minutes, stirring now and then, until soft, sweet and lightly golden. Add the garlic for the last 2 minutes. Then tip everything out into a bowl.<\/p>", "why": "<p><strong>The water:<\/strong> It keeps the pan cool at first, so the fat melts out evenly before the meat starts to colour. That gives more fat to cook in, and the pancetta crisps all the way through instead of burning at the edges. <strong>Slowly:<\/strong> This base (a <em>soffritto<\/em>) is the backbone of any ragù. Slow cooking turns the onion and carrot sweet; fast cooking makes them bitter. Dicing them small lets them melt into the sauce.<\/p>"}, {"n": 4, "phase": "One pan: vegetables, searing, the braise", "title": "Sear the cheeks in the same pan", "text": "<p>Lift out any loose bits of vegetable left behind, but keep the thin brown film stuck to the bottom. Add 1–2 tbsp of the marrow fat (or oil) and let the pan get properly hot, so a cheek sizzles loudly the moment it goes in. Pat the cheeks dry and brown them for 3–4 minutes a side without moving them, until deep chestnut brown all over. Leave a finger's width between pieces, and do two batches if they don't fit. Lift them out onto a plate.<\/p>", "why": "<p><strong>One pan:<\/strong> The browned film from the vegetables and the crust from the searing all stay in the same pot and end up in the sauce. Loose bits of vegetable would burn at searing heat, which is why they come out first. <strong>Sear:<\/strong> Browning creates savoury, roasted flavours that the braise can't make by itself. Crowded meat steams and stays grey.<\/p>"}, {"n": 5, "phase": "One pan: vegetables, searing, the braise", "title": "Vegetables back in, then fry the tomato purée", "text": "<p>Return the vegetables and pancetta. Push them aside, add the purée to the bare patch, and fry for 3–4 minutes, stirring, until it darkens from bright red to brick red and starts to catch.<\/p>", "why": "<p><strong>After the searing:<\/strong> The purée is the ingredient most likely to burn. Fried before the searing, any left on the pan would scorch at searing heat and turn bitter. Fried now, it also picks up the crust from the cheeks. <strong>Fry it at all:<\/strong> Frying caramelises the purée's sugars and takes away its raw, tinny taste. This is where much of the deep tomato flavour comes from.<\/p>"}, {"n": 6, "phase": "One pan: vegetables, searing, the braise", "title": "Add the wine and boil it down by half", "text": "<p>(8–10 minutes) over a high heat, scraping the bottom.<\/p>", "why": "<p>This boils off the harsh alcohol and concentrates the wine's fruit. Wine that isn't reduced tastes sharp and boozy, even after hours in the oven. The scraping lifts every browned bit into the sauce.<\/p>"}, {"n": 7, "phase": "One pan: vegetables, searing, the braise", "title": "Assemble the braise", "text": "<p>Crush the whole tomatoes into the casserole by hand and swirl a splash of water round each tin to get the rest out. Return the cheeks and their juices. Tuck the marrow bones in around them, with the herbs, the peppercorns and the Parmesan rind. Pour in stock until the liquid comes <strong>about three-quarters of the way up the meat<\/strong>, not over it. Bring it to a gentle simmer.<\/p>", "why": "<p><strong>Whole tins:<\/strong> Whole tinned tomatoes are usually better quality than chopped ones. Chopped tomatoes are often treated to keep their shape, so they never fully break down into the sauce. <strong>Three-quarters:<\/strong> This is a braise, not a boil. The covered pot fills with steam and cooks the tops of the cheeks, and less liquid means a more concentrated sauce. Bringing it to a simmer first means the oven doesn't spend its first hour just heating the pot. <strong>No salt here:<\/strong> The cheeks, pancetta, stock and rind are all salty, and the sauce reduces by about a third. Taste and salt at the end, never now.<\/p>"}, {"n": 8, "phase": "The oven", "title": "Cook covered for 3 hours", "text": "<p>Press a sheet of baking paper onto the surface, put the lid on fully, and cook at 130 °C fan.<\/p>", "why": "<p>At this low setting the liquid barely trembles, at about 90–95 °C inside the pot. That's hot enough to melt the collagen into gelatine over a few hours, but gentle enough that the muscle fibres don't clench and squeeze out their juice. The baking paper and full lid stop the fan drying the exposed meat and slow evaporation. Check it at 1 hour. If there isn't a single bubble, raise the oven by 10 °C. If it's bubbling hard, lower it by 10 °C. Short of time? Use 140 °C fan from the start, but no higher: above that the liquid boils and the meat tightens.<\/p>"}, {"n": 9, "phase": "The oven", "title": "After 3 hours, turn the cheeks and take off the lid and paper", "text": "<p>Top up with stock or water if the liquid has dropped below halfway. Cook for another 30–90 minutes (up to 2 hours for whole cheeks).<\/p>", "why": "<p>With the lid off, the sauce reduces and the exposed meat browns a little, which deepens the flavour again.<\/p>"}, {"n": 10, "phase": "The oven", "title": "Test for doneness from 3½ hours", "text": "<p>(4½ for whole cheeks). Press a piece with the back of a spoon. It should collapse with no resistance, and a fork should twist through it easily. If it doesn't, give it another 30 minutes and test again.<\/p>", "why": "<p>Undercooked cheek is the most common way this dish goes wrong: it's chewy, not tender. Overcooking within 6 hours is unlikely, so when in doubt, give it longer.<\/p>"}, {"n": 11, "phase": "The oven", "title": "Rest it", "text": "<ul><li><strong>Standard:<\/strong> rest for 30 minutes out of the oven. Tilt the pot so the fat pools on one side, and lift most of it off with a ladle, keeping a spoonful in for flavour.<\/li><li><strong>Elevated:<\/strong> let it cool in its liquid, then refrigerate overnight. Next day, lift off the set fat in one piece (keep a spoonful), and reheat the pot gently on the hob, covered, for 20–30 minutes until bubbling at the edges.<\/li><\/ul>", "why": "<p>Resting lets the meat take back some of the liquid so it stays moist, and lets the fat rise so it's easy to take off.<\/p>"}, {"n": 12, "phase": "Finishing", "title": "Take out the cheeks, bones, herbs and rind", "text": "<p>Scrape any marrow still in the bones into the sauce.<\/p>", "why": ""}, {"n": 13, "phase": "Finishing", "title": "Reduce the sauce", "text": "<p>Simmer it on the hob for 10–20 minutes until it coats a spoon thickly and looks glossy. Cook the pasta meanwhile.<\/p>", "why": "<p>A ragù should cling to whatever it's served with, not pool around it.<\/p>"}, {"n": 14, "phase": "Finishing", "title": "Shred the cheeks", "text": "<p>Pull them into bite-sized chunks with two forks, leaving some pieces bigger than others, and stir them back into the sauce. For risotto, leave them in larger pieces (see Serving).<\/p>", "why": "<p><strong>Uneven:<\/strong> The mix of tender shreds and bigger chunks gives the sauce texture, so no two forkfuls are the same.<\/p>"}, {"n": 15, "phase": "Finishing", "title": "Finish it off the heat", "text": "<p>Stir in the reserved marrow (or saved marrow fat) and the cold butter until they melt and the sauce turns glossy. Season with black pepper, then taste for salt. Add the vinegar or lemon a few drops at a time, until the sauce tastes bright rather than heavy.<\/p>", "why": "<p>This is where the marrow comes through clearly. Added at the end it tastes of marrow, where the half cooked for hours has become general richness. The acid wakes up flavours that hours of cooking have dulled. Seasoning last avoids over-salting, because reducing concentrates the salt already there.<\/p>"}], "extras": [{"name": "Bones", "html": "<p>Marrow is the flavour you want to come through clearly, and only <strong>marrow bones<\/strong> give it: thick leg bones <strong>cut through<\/strong> so the marrow shows. Bones this hard can't be cut at home with kitchen knives, so ask the butcher to saw them into rounds or \"canoes\" (split lengthways). It takes them a minute.<\/p><p><strong>If all you have are whole, thin bones:<\/strong> roast them whole for about 20 minutes. They give little solid marrow, but plenty of liquid fat, and that fat <em>is<\/em> the marrow flavour. Pour it off and keep it: use it for searing, and save about 2 tbsp in the fridge to stir in at the finish in place of the scooped marrow. Put any bones that fit into the braise.<\/p>"}, {"name": "Versions", "html": "<p><strong>Standard<\/strong> (about 6½–7 hours)<\/p><div class=\"tbl\"><table><thead><tr><th>From start<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>0:00<\/td><td>Oven on to 200 °C fan. Halve and salt the cheeks (step 1).<\/td><\/tr><tr><td>0:05<\/td><td>Marrow bones into the oven (step 2). Dice the vegetables.<\/td><\/tr><tr><td>0:25<\/td><td>Bones out; scoop the marrow; oven down to 130 °C fan. Start the pancetta and vegetables (step 3).<\/td><\/tr><tr><td>0:50<\/td><td>Vegetables out of the pan.<\/td><\/tr><tr><td>1:00<\/td><td>Sear the cheeks (step 4).<\/td><\/tr><tr><td>1:15<\/td><td>Vegetables back; tomato purée; wine (steps 5–6).<\/td><\/tr><tr><td>1:30<\/td><td>Assemble the braise (step 7).<\/td><\/tr><tr><td>1:40<\/td><td>Into the oven (step 8).<\/td><\/tr><tr><td>4:40<\/td><td>Turn the cheeks; lid off (step 9).<\/td><\/tr><tr><td>5:10–6:10<\/td><td>Tender? Out to rest for 30 minutes (steps 10–11). Put the pasta water on.<\/td><\/tr><tr><td>5:40–6:40<\/td><td>Finish and serve (steps 12–15).<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Elevated<\/strong> (three days)<\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>Day 1, evening (10 min)<\/td><td>Trim the cheeks and salt them <strong>whole<\/strong>; leave uncovered in the fridge overnight (step 1). Optional: make bone stock during the day (see the notes).<\/td><\/tr><tr><td>Day 2 (about 6½ hours)<\/td><td>Cook as for the standard version, from the bones onwards. Whole cheeks take a little longer, about 4½–5 hours in the oven. Cool in the liquid, then refrigerate overnight (step 11).<\/td><\/tr><tr><td>Day 3 (40 min)<\/td><td>Lift off the set fat, reheat gently, finish and serve (steps 12–15).<\/td><\/tr><\/tbody><\/table><\/div><p><em>Why elevated tastes deeper:<\/em> overnight, the salt seasons the cheeks right to the centre and dries their surface so they brown harder. After cooking, a night in the fridge lets the sauce settle and the flavours meld into one, and the meat reabsorbs liquid as it cools. The fat sets into a lid that lifts off in one piece.<\/p>"}, {"name": "Serving", "html": "<p><strong>Pasta: tagliatelle.<\/strong> Pappardelle is too wide to wrap round the meat nicely, even cooked exactly right. Tagliatelle is narrower but still flat enough to carry the shredded meat. Use 100 g dried or 120 g fresh pasta per person. Cook it 1–2 minutes short of the packet time, then toss it in a wide pan with the ragù and a splash of the pasta water for a minute or two, until the sauce clings and shines. Serve with Parmesan.<\/p><p><strong>Plating:<\/strong> twist the pasta into a nest in a warm, shallow bowl, spoon over a little extra sauce, and top with two or three bigger chunks of cheek kept back while shredding. Shave Parmesan over with a peeler, add a pinch of gremolata and a crack of pepper, then wipe the rim.<\/p><p><strong>Risotto: risotto alla milanese.<\/strong> This is the classic partner for braised beef in Milan (it's what ossobuco is served on), and it's traditionally made with beef marrow, so it echoes the ragù. Best with the elevated version, when the ragù only needs reheating and your hands are free to stir. Serve the cheeks in larger pieces on top, with gremolata. For 4:<\/p><ul><li>320 g Carnaroli rice<\/li><li>1 small onion, very finely chopped<\/li><li>30 g bone marrow (scoop an extra bone) or butter<\/li><li>100 ml dry white wine<\/li><li>about 1.2 litres of hot stock<\/li><li>a generous pinch of saffron (about 0.2 g), steeped in a ladle of the stock<\/li><li>40 g cold butter<\/li><li>60 g Parmesan, grated<\/li><\/ul><p>Soften the onion in the marrow, toast the rice for 2 minutes, then add the wine. Add the stock a ladle at a time, stirring, for 16–18 minutes, adding the saffron halfway. Off the heat, beat in the cold butter and Parmesan (<em>mantecatura<\/em>) and rest it for 2 minutes.<\/p><p><strong>Gremolata<\/strong> (good with either, essential with the risotto): the zest of 1 lemon, a small bunch of flat-leaf parsley and 1 small garlic clove, all chopped finely together. Scatter it over just before serving. It cuts through the richness.<\/p>"}, {"name": "Leftovers", "html": "<ul><li><strong>Keeps<\/strong> 4 days in the fridge, or 3 months frozen. Freeze it before the final butter and marrow, and add those when reheating.<\/li><li><strong>Proven so far:<\/strong> more pasta, loaded fries, and over rice. All three were excellent.<\/li><li><strong>Also worth trying:<\/strong> stuffed into a baked potato with cheese; as a pie filling under mash; in a toasted sandwich with melted cheese.<\/li><\/ul>"}, {"name": "Notes", "html": "<ul><li><strong>Bone stock (elevated, if you have spare bones).<\/strong> Cover roasted non-marrow bones with cold water, add vegetable trimmings and a bay leaf, and simmer gently with the lid ajar for 4–6 hours. Strain it and reduce it to about 600 ml.<\/li><li><strong>Red or white wine?<\/strong> Red, for this: it gives depth, colour and the richness you want with beef. White makes a lighter, more tomato-led sauce. Cook with a wine you'd happily drink, and serve the rest of the bottle with dinner.<\/li><li><strong>No anchovies<\/strong> in this version, by choice. The Parmesan rind gives the savoury depth instead.<\/li><li><strong>Fan ovens vary.<\/strong> The temperatures here assume a true 130 °C fan. Trust the bubbles in step 8 more than the dial.<\/li><\/ul>"}]}, {"slug": "coq-au-vin", "title": "Coq au vin", "intro": "Chicken braised in red wine and cognac with smoky lardons, finished with goose-fat-roasted mushrooms, carrots and shallots. Boneless thighs make it calm to cook and easy to reheat; crackling sheets of roasted chicken skin bring back the crunch, and quick-pickled shallots cut through the richness. Served on mashed potato.", "kind": "French", "line": "Chicken braised in red wine and cognac, with crisp skin and pickled shallots.", "time": "About 5 hours", "serves": "Serves 6–8", "base": 6, "unit": "people", "groups": [{"name": "From the butcher", "items": ["1.2 kg boneless, skinless chicken thighs (10–12)", "600 g boneless, skinless chicken breast (3), for anyone who prefers white meat", "300 g chicken skin, in sheets as large as possible", "4–6 chicken wings, for the sauce's body", "300 g smoked lardons, or smoked streaky bacon or pancetta in a piece, cut into thick batons"]}, {"name": "Vegetables", "items": ["For the sauce base (fine dice): 2 onions, 2 carrots, 2 celery sticks, 6 garlic cloves", "For roasting (medium dice, about 1.5 cm): 2 carrots, 3 banana shallots, 450 g chestnut mushrooms", "For pickling: 3 banana shallots", "2 kg floury potatoes (Maris Piper or King Edward)", "A small bunch of flat-leaf parsley (optional, for colour)"]}, {"name": "Wine and stock", "items": ["2 bottles of red Burgundy or another light, fruity Pinot Noir (you'll use about 1.1 litres)", "75 ml cognac or brandy", "450 ml good chicken stock (fresh, not cubes)"]}, {"name": "Cupboard and fridge", "items": ["Fine sea salt, black pepper, sugar", "2 tbsp tomato purée", "Goose fat (about 3 tbsp)", "Red wine vinegar (150 ml)", "Fresh thyme, bay leaves, rosemary", "Butter (about 250 g in all) and plain flour (30 g)", "Milk or cream (250 ml), for the mash", "1 tsp redcurrant jelly (optional)"]}], "steps": [{"n": 1, "phase": "In the morning", "title": "Salt the chicken", "text": "<p>Weigh the thighs and breast together, and use 1% of that weight in salt (about 18 g). Cut the breasts into large chunks, about 5 cm. Sprinkle the salt evenly over everything, then keep the thighs and breast chunks on separate plates, uncovered, in the fridge.<\/p>", "why": "<p>Hours of salt season the meat right through and dry the surface, so it browns rather than steams. The breast stays separate because it goes in much later.<\/p>"}, {"n": 2, "phase": "In the morning", "title": "Pickle the shallots", "text": "<p>Slice the 3 banana shallots into thin rings and pack them into a jar. Warm 150 ml red wine vinegar, 75 ml water, 2 tbsp sugar and 1 tsp salt until dissolved, pour it over, and leave it to cool. They're ready in an hour, and better after several.<\/p>", "why": "<p>They're the sharp, fresh note on a very rich plate: sweet-sour, crunchy, and bright pink against the dark sauce.<\/p>"}, {"n": 3, "phase": "The skin sheets", "title": "Roast the skin flat", "text": "<p>Scrape any lumps of fat from the underside of the skin and pat it dry. Lay the pieces flat and stretched on a tray lined with baking paper, and salt them. Rub a little thyme into the salt first, if you like. Cover with a second sheet of paper and the second tray, and weight it with something ovenproof. Roast at <strong>190 °C fan for 30–45 minutes<\/strong> until deep golden and glassy; check from 25 minutes. Drain on kitchen paper, then keep them in an airtight box once cool. Pour the rendered chicken fat into a jar.<\/p>", "why": "<p><em>Small pieces?<\/em> Overlap them by about 1 cm before pressing; the overlaps fuse into larger sheets as they render. <strong>Pressed:<\/strong> Left loose, skin curls and shrinks into crinkly bits. Pressed between trays, it sets flat and rigid, so it can stand up in the mash. It shrinks by about half, which is why you buy 300 g.<\/p>"}, {"n": 4, "phase": "The braise", "title": "Render the lardons", "text": "<p>Put them in the cold casserole with 2–3 tbsp water over a medium-low heat. Let the water cook off and the fat run, then let them crisp. Lift them out, and keep <strong>half<\/strong> aside for the top.<\/p>", "why": "<p>The water melts the fat out evenly before the meat colours, as with the ragù's pancetta. That smoky fat is what everything else browns in.<\/p>"}, {"n": 5, "phase": "The braise", "title": "Brown the thighs", "text": "<p>Brown the thighs in the lardon fat over a medium-high heat, in batches with space between them, 3–4 minutes a side, until deep golden. Pat them dry first. Lift them onto a plate. Then brown the wings the same way.<\/p>", "why": "<p>The browning makes the sauce's roasted depth. Crowded meat steams and stays grey.<\/p>"}, {"n": 6, "phase": "The braise", "title": "The base", "text": "<p>Pour off all but 2–3 tbsp fat. Over a medium heat, soften the finely diced onion, carrot and celery with a pinch of salt for 10 minutes, until soft and lightly golden. Add the garlic for a minute, then the tomato purée, and fry for 2–3 minutes until brick red.<\/p>", "why": "<p>The fine dice melts into the sauce for body and sweetness. Frying the purée caramelises it and takes away its tinny taste.<\/p>"}, {"n": 7, "phase": "The braise", "title": "Cognac, then wine", "text": "<p>Off the heat, pour in the cognac and scrape the bottom hard. Flambé it if you like: stand back, light it, and let it burn out by itself. Back on a high heat, add 1.1 litres of the wine and boil it down by a third, about 15 minutes.<\/p>", "why": "<p>The cognac lifts the browned crust and adds warmth. Boiling the wine down drives off the raw alcohol and concentrates its fruit.<\/p>"}, {"n": 8, "phase": "The braise", "title": "Assemble", "text": "<p>Add the stock, the herbs tied in a bundle, the lardons you didn't keep back, the wings, and the thighs with their juices. The thighs should be just covered; top up with a little stock or water if not. Bring it to a simmer, put the lid on, and cook in the oven at <strong>150 °C fan (170 °C conventional)<\/strong>.<\/p>", "why": "<p><strong>The wings:<\/strong> Their bones and skin give the sauce gelatine, which makes it silky. Boneless thighs alone can't.<\/p>"}, {"n": 9, "phase": "The braise", "title": "Cook", "text": "<p>Cook for 50–60 minutes, until the thighs are tender and give easily when pressed (85 °C or more is fine for thighs). Take the casserole out and leave it on the side with the lid on. It's fine there for up to 2 hours; if your plan needs longer, let it cool for an hour, then refrigerate it.<\/p>", "why": "<p>Thighs turn tender as their connective tissue softens, and they're very forgiving. Resting lets the flavours settle and the fat rise to the top.<\/p>"}, {"n": 10, "phase": "The final hour", "title": "Roast the vegetables", "text": "<p>Toss the medium-dice carrots and shallots and the mushrooms (halved or quartered to about the same size) with 3 tbsp goose fat or the saved chicken fat and a pinch of salt. Spread them in one layer and roast at <strong>200 °C fan for 25–30 minutes<\/strong> until golden at the edges.<\/p>", "why": "<p>Hot, dry oven air browns far better than a crowded pan, and one tray does the lot. They join the sauce only at the end, so they stay as distinct, roasted pieces rather than stewing.<\/p>"}, {"n": 11, "phase": "The final hour", "title": "Reheat the braise", "text": "<p>Reheat the braise gently on a low hob, stirring now and then, until it's bubbling throughout. Lift out the wings and herb bundle. Skim off the fat that has risen, keeping a spoonful.<\/p>", "why": ""}, {"n": 12, "phase": "The final hour", "title": "Cook the breast chunks", "text": "<p>Pat them dry and brown them quickly in a hot frying pan with a little fat, 1–2 minutes a side; they shouldn't cook through. Slip them into the gently bubbling sauce for <strong>10–15 minutes<\/strong>, until they reach <strong>68 °C<\/strong> at the centre. Then stop the cooking.<\/p>", "why": "<p><strong>So late:<\/strong> Breast is lean and turns dry and stringy above 70 °C, so it gets only the time it needs. Browning it first gives it the same colour and flavour as the thighs.<\/p>"}, {"n": 13, "phase": "The final hour", "title": "Finish the sauce", "text": "<p>Stir in the roasted vegetables. Mash 30 g soft butter with 30 g flour into a paste, and whisk it into the sauce a small piece at a time, letting each piece thicken before adding more. Stop when the sauce coats a spoon. Taste: black pepper, salt if needed, and the redcurrant jelly if the wine tastes sharp.<\/p>", "why": "<p>The butter and flour paste thickens without lumps and gives the sauce a shine; adding it gradually lets you stop at exactly the right thickness.<\/p>"}], "extras": [{"name": "Versions", "html": "<p><strong>Cook early, serve at 7 pm<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>Morning, before 11<\/td><td>Shop. Salt the thighs and the breast, separately, and refrigerate them uncovered (step 1). Pickle the shallots (step 2).<\/td><\/tr><tr><td>12:30 pm<\/td><td>Chop everything: fine dice for the base, medium dice for roasting.<\/td><\/tr><tr><td>1:00<\/td><td>Oven at 190 °C fan. Skin sheets in (step 3). Lardons into the casserole (step 4).<\/td><\/tr><tr><td>1:15<\/td><td>Brown the thighs (step 5).<\/td><\/tr><tr><td>1:45<\/td><td>Skin out to drain; oven down to 150 °C fan. Mirepoix, purée, cognac, wine (steps 6–7).<\/td><\/tr><tr><td>2:30<\/td><td>Assemble and into the oven (step 8).<\/td><\/tr><tr><td>3:30–3:45<\/td><td>Thighs tender? Out of the oven to rest, lid on (step 9).<\/td><\/tr><tr><td>5:30<\/td><td>Oven to 200 °C fan; vegetables in to roast (step 10).<\/td><\/tr><tr><td>5:45<\/td><td>Potatoes on. Casserole onto a low hob to reheat (step 11).<\/td><\/tr><tr><td>6:15<\/td><td>Brown the breast chunks; into the casserole (step 12).<\/td><\/tr><tr><td>6:25<\/td><td>Roasted vegetables in; finish the sauce (step 13). Skin back in the oven for 3 minutes.<\/td><\/tr><tr><td>6:35<\/td><td>Mash.<\/td><\/tr><tr><td>6:45<\/td><td>Plate (see Serving).<\/td><\/tr><tr><td>7:00<\/td><td>Serve.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Straight through:<\/strong> the same steps without the rest. Start the skin and lardons at 3:30 pm. Roast the vegetables while the braise is in the oven, then go straight from step 9 into steps 12–13 as soon as the thighs are tender. The flavour is a little less settled than when it's rested.<\/p><p><strong>Elevated:<\/strong> salt the chicken and braise the day before (steps 1 and 3–9). Cool it, refrigerate overnight, then lift off the set fat in one piece. On the day, reheat it gently and carry on from step 10. The skin sheets keep for a day in an airtight box. <em>Why resting tastes deeper:<\/em> as the braise sits, the wine, cognac and smoke meld into one, and the meat takes back liquid as it cools. A few hours does much of this; overnight does it fully.<\/p>"}, {"name": "Serving", "html": "<p><strong>Mash:<\/strong> boil the peeled, quartered potatoes in salted water for 20 minutes until completely soft. Drain, let them steam dry for 2 minutes, then mash or rice with about 200 g butter and the warm milk or cream. Season well.<\/p><p><strong>Plating, on warm, wide plates:<\/strong><\/p><ul><li><strong>Mash:<\/strong> a mound on one side, dragged into a crescent with the back of a spoon. Keep it clear of the rim.<\/li><li><strong>Chicken:<\/strong> a thigh or two (or breast pieces) leaning against the inside of the crescent, half on the mash.<\/li><li><strong>Sauce:<\/strong> into the open curve, so it pools against the mash rather than flooding it, with the mushrooms, carrots and shallots on that side.<\/li><li><strong>On top:<\/strong> the lardons you kept back over the chicken, then a few pickled shallot rings over the chicken and sauce, and a pinch of parsley if you're using it.<\/li><li><strong>The skin, last of all:<\/strong> one tall shard pushed upright into the back of the mash, and a smaller piece by the chicken. Keep it out of the sauce: steam softens it within minutes.<\/li><li><strong>Wipe the rim.<\/strong> Put a jug of extra sauce on the table.<\/li><\/ul>"}, {"name": "Leftovers", "html": "<ul><li><strong>Keeps<\/strong> 3 days in the fridge, and it's even better on day two. Keep the skin sheets in an airtight box and re-crisp them in a hot oven.<\/li><li><strong>What to make:<\/strong><\/li><li><strong>Pasta:<\/strong> shred the chicken into the sauce and toss it through tagliatelle.<\/li><li><strong>A pie:<\/strong> chicken, sauce and vegetables under a puff-pastry lid, 25 minutes at 200 °C fan.<\/li><li><strong>Loaded fries:<\/strong> chicken and sauce over fries, with crumbled skin and pickled shallots on top.<\/li><li><strong>Toast:<\/strong> chicken and mushrooms in sauce on thick toast, with a fried egg and a shard of skin.<\/li><\/ul>"}, {"name": "Notes", "html": "<ul><li><strong>If the butcher gives you the bones<\/strong> (a carcass and thigh bones): roast them at 200 °C fan for 30–40 minutes until deep golden, then simmer them with about 2 litres of cold water, a bay leaf and a few peppercorns (no salt) at the barest bubble for 2–3 hours. Strain, and use it in place of the bought stock. It's richer, and its gelatine gives the sauce body, so the wings become optional. Short of time: roast the bones and tuck them into the braise instead, and lift them out before serving.<\/li><li><strong>Wine:<\/strong> Burgundy is the classic, because it's Pinot Noir: light, fruity, and it doesn't turn bitter when reduced. Avoid heavy, oaky reds. Serve the same kind with dinner.<\/li><li><strong>Showpiece version (skin-on, in a roasting tray):<\/strong> use bone-in, skin-on thighs and breasts. Make the sauce in the casserole without the chicken. Spread the medium-dice vegetables over a deep roasting tray with the thighs on top, skin-up, and roast at 210 °C fan for 30 minutes. Then pour the sauce around them, keeping the skin clear, and braise uncovered at 150 °C fan. Sear the breasts skin-side in a pan and add them 45 minutes before the end, out at 68 °C; thighs out at 80–85 °C. Roast the mushrooms in a separate tray. It's more dramatic, with more timings to juggle, and it can't be cooked ahead without the skin softening.<\/li><\/ul>"}]}, {"slug": "chilli-miso-ramen", "title": "Chilli miso ramen with crisp chicken and soy eggs", "intro": "A creamy, deeply savoury chilli miso broth over springy ramen noodles, topped with crisp-skinned lacquered chicken thigh, jammy soy-marinated eggs, seared pak choi and a knob of butter. Based on a recipe Alexander saw, then worked out together: a stronger broth, skin-on chicken, a proper egg marinade and real ramen noodles.", "kind": "Japanese", "line": "Creamy chilli miso broth, crisp chicken and soy eggs.", "time": "About 3 hours", "serves": "Serves 4", "base": 4, "unit": "people", "groups": [{"name": "Asian supermarket", "items": ["Fresh or frozen ramen noodles, 4 portions (about 130–150 g each)", "Kombu (dried kelp), one 10 cm strip", "Dried shiitake mushrooms, 6", "Doubanjiang (Sichuan chilli bean paste); Pixian or Lee Kum Kee", "White miso (shiro) and red miso (aka)", "Mirin", "Japanese soy sauce (Kikkoman is fine)", "Sichuan chilli crisp (Lao Gan Ma \"Spicy Chili Crisp\")", "Nori sheets", "Crispy fried shallots (a tub)", "Toasted sesame seeds and toasted sesame oil"]}, {"name": "Supermarket or butcher", "items": ["6 boneless chicken thighs, <strong>skin on<\/strong> (about 800 g). Supermarket boneless thighs are usually skinless, so ask a butcher, or buy bone-in skin-on thighs and cut out the bone (see the notes).", "6 large eggs (4 for the bowls, 2 spare)", "1.6 litres fresh chicken stock (pots, not cubes; low-salt if there's a choice)", "4 baby pak choi", "2 bunches spring onions", "3 shallots", "1 bulb garlic", "1 large piece fresh ginger (about 8 cm)", "Tahini", "Runny honey", "Caster or granulated sugar", "Butter", "Neutral oil (sunflower or vegetable)"]}], "steps": [{"n": 1, "phase": "Day 1: the night before", "title": "Cold-soak the stock", "text": "<p>Pour the stock into a jug or the broth pan, add the kombu strip and the dried shiitake, cover, and refrigerate overnight.<\/p>", "why": "<p>Kombu and shiitake each carry a different savoury compound, and together they taste far stronger than either alone. That's the basis of Japanese stock. Soaking them cold draws out their flavour gently; boiling kombu makes it slimy and bitter.<\/p>"}, {"n": 2, "phase": "Day 1: the night before", "title": "Marinate the chicken", "text": "<p>In the zip-lock bag, mix 3 tbsp soy, 2 tbsp mirin, 1 tbsp honey, 2 grated garlic cloves, 2 cm grated ginger and 1 tsp sesame oil. Add the thighs, squeeze out the air, massage, and refrigerate.<\/p>", "why": "<p>Soy seasons the meat right through; mirin and honey bring sweetness and help it caramelise in the pan, which gives the lacquered char. Keep it to <strong>4–24 hours<\/strong>: any longer and the soy starts to cure the meat, which turns firm and slightly ham-like.<\/p>"}, {"n": 3, "phase": "Day 1: the night before", "title": "Soft-boil and marinate the eggs", "text": "<ul><li><strong>The marinade:<\/strong> stir together 100 ml soy, 100 ml mirin, 100 ml water and 1 tbsp sugar until the sugar dissolves.<\/li><li><strong>Boil:<\/strong> bring a pot of water to a full rolling boil. Lower in the eggs straight from the fridge with a spoon, and set a timer for <strong>6 minutes 30 seconds<\/strong>.<\/li><li><strong>Chill:<\/strong> lift them straight into the iced water for 5 minutes.<\/li><li><strong>Peel<\/strong> them under water, starting from the wide end, where there's an air pocket.<\/li><li><strong>Marinate:<\/strong> put them in a small container or a second bag, pour over the marinade, and lay a piece of kitchen paper on top so they stay submerged. Refrigerate overnight.<\/li><\/ul>", "why": "<p>6½ minutes from fridge-cold gives a set white and a jammy, just-runny yolk. The ice stops the cooking at once and helps the shell come away cleanly. The marinade is diluted with mirin and water, because straight soy over-salts the eggs and turns the whites rubbery within a few hours. Overnight they turn deep amber and the yolk takes on the seasoning.<\/p>"}, {"n": 4, "phase": "Day 2: the broth", "title": "Get everything ready", "text": "<p>Take the eggs and chicken out of the fridge. Lift the kombu out of the stock and discard it. Squeeze the shiitake back into the stock, cut off their stems, and slice the caps thinly to use as a topping.<\/p><ul><li>Finely chop the 3 shallots.<\/li><li>Slice the white parts of 4 spring onions, then thinly slice the greens for garnish.<\/li><li>Mince 4 garlic cloves and 3 cm ginger.<\/li><\/ul>", "why": ""}, {"n": 5, "phase": "Day 2: the broth", "title": "Fry the aromatics", "text": "<p>In the broth pan, warm 2 tbsp neutral oil over a medium-low heat. Add the shallots and spring onion whites and cook gently for 5 minutes until soft. Add the garlic and ginger for 1 minute, then <strong>1 tbsp doubanjiang<\/strong> (2 tbsp if you like more heat), and fry for 1–2 minutes until the oil turns red.<\/p>", "why": "<p>Frying the chilli bean paste releases its colour and flavour into the oil, which then carries the heat and fermented depth all through the broth, rather than only through the chilli crisp on top.<\/p>"}, {"n": 6, "phase": "Day 2: the broth", "title": "Build the broth", "text": "<p>Pour in the stock, add 2 tbsp soy, 2 tbsp mirin and <strong>2 tbsp tahini<\/strong>, and whisk until smooth. Simmer gently for 10 minutes, then turn it down to a bare simmer.<\/p>", "why": "<p>The tahini makes the broth creamy and nutty, giving it body without dairy. The bits of shallot and ginger stay in for texture; strain them out if you'd rather have a perfectly smooth broth.<\/p>"}, {"n": 7, "phase": "Day 2: the chicken and pak choi", "title": "Fry the chicken skin-side down", "text": "<p>Take the thighs out of the marinade and pat them very dry with kitchen paper (keep the marinade out of the pan). Heat 1 tbsp oil in the frying pan over a <strong>medium<\/strong> heat. Lay the thighs in skin-side down, press them flat with a spatula for the first minute, and leave them alone for <strong>8–10 minutes<\/strong> until the skin is deep golden and crisp.<\/p>", "why": "<p>A wet surface steams instead of crisping, and the sugary marinade would burn. Medium heat, not high, because the honey on the meat darkens fast. Pressing at the start keeps the whole skin in contact with the pan.<\/p>"}, {"n": 8, "phase": "Day 2: the chicken and pak choi", "title": "Flip, finish and lacquer", "text": "<p>Turn the thighs and cook for 4–5 minutes more, until the thickest part reads <strong>78–80 °C<\/strong>. Meanwhile mix the glaze: 1 tbsp soy, 1 tbsp mirin, 1 tsp honey. Brush it over the skin, flip the thighs skin-down for <strong>15–20 seconds<\/strong> to set it, then lift them out onto a board, skin up. Rest for 5 minutes.<\/p>", "why": "<p>Thighs need about 78 °C before they turn properly tender. A few seconds of contact caramelises the glaze into a lacquer; any longer and it burns. Resting keeps the juices in the meat when you slice it.<\/p>"}, {"n": 9, "phase": "Day 2: the chicken and pak choi", "title": "Sear the pak choi in the same pan", "text": "<p>Pour off all but 1 tbsp of the fat. Put the pak choi halves in cut-side down and cook for 2–3 minutes until golden. Add 2 tbsp water, cover with a lid for 1 minute, then lift them out.<\/p>", "why": "<p>The chicken fat and browned bits flavour the pak choi. Searing gives the toasty colour; the quick steam softens the thick stems without charring them.<\/p>"}, {"n": 10, "phase": "Day 2: finishing and assembling", "title": "Deglaze the pan", "text": "<p>Pour a ladle of broth into the hot frying pan, scrape up all the browned bits, and tip it all back into the broth.<\/p>", "why": "<p>That browned crust is concentrated chicken flavour; it belongs in the soup.<\/p>"}, {"n": 11, "phase": "Day 2: finishing and assembling", "title": "Add the miso, off the heat", "text": "<p>Take the broth off the heat. In a ladle or small bowl, mix <strong>3 tbsp white miso and 2 tbsp red miso<\/strong> with some hot broth until smooth, then whisk it back into the pan. Taste: add more soy for salt, more mirin for sweetness, or more doubanjiang (fried first in a little oil) for heat. Keep it hot, but don't let it boil again.<\/p>", "why": "<p>Boiling dulls miso's aroma and can make it grainy. Melting it in a ladle first stops it going lumpy. White miso is sweet and mild; red is deep and salty; together they taste rounder than either.<\/p>"}, {"n": 12, "phase": "Day 2: finishing and assembling", "title": "Cook the noodles", "text": "<p>Bring a large pot of water to the boil, <strong>without salt<\/strong>. Cook the noodles for 30 seconds less than the packet says, then drain and shake them hard in the colander. Meanwhile, fill the bowls with boiling water to warm them.<\/p>", "why": "<p>Ramen noodles are already salty. Undercooking slightly allows for the time they sit in hot broth. Shaking off the water keeps the broth from being diluted. Warm bowls keep everything hot to the last spoonful.<\/p>"}, {"n": 13, "phase": "Day 2: finishing and assembling", "title": "Assemble", "text": "<p>Empty the bowls. Slice the chicken into 1 cm batons and halve the eggs (a wet knife cuts the yolk cleanly). Into each bowl:<\/p><ul><li><strong>Broth:<\/strong> about 375 ml.<\/li><li><strong>Noodles:<\/strong> lift and fold them in so they sit in a neat pile.<\/li><li><strong>Toppings:<\/strong> chicken batons fanned on one side, two egg halves yolk up, a pak choi half, a few slices of shiitake.<\/li><li><strong>Butter:<\/strong> a knob (about 10 g) on top, to melt in.<\/li><li><strong>Garnish:<\/strong> spring onion greens, sesame seeds and crispy shallots.<\/li><li><strong>Nori:<\/strong> a sheet tucked in upright at the edge.<\/li><li><strong>Chilli crisp:<\/strong> a spoonful on top, with more at the table.<\/li><\/ul>", "why": "<p><strong>The order:<\/strong> Noodles in the broth first so they're coated and warm; the toppings sit on the noodles and stay visible; nori goes in last because it softens within a minute.<\/p>"}], "extras": [{"name": "Versions", "html": "<p><strong>Standard<\/strong> (about 3 hours)<\/p><div class=\"tbl\"><table><thead><tr><th>From start<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>0:00<\/td><td>Boil, peel and marinate the eggs (step 3). Marinate the chicken in the fridge (step 2).<\/td><\/tr><tr><td>0:20<\/td><td>Hot-soak the stock: kombu and shiitake in the stock, heated to steaming but not simmering, for 30 minutes. Lift the kombu out before it boils.<\/td><\/tr><tr><td>0:50<\/td><td>Make the broth (steps 4–6).<\/td><\/tr><tr><td>2:00<\/td><td>Fry the chicken, then the pak choi (steps 7–9).<\/td><\/tr><tr><td>2:40<\/td><td>Finish the broth, cook the noodles, assemble (steps 10–13).<\/td><\/tr><\/tbody><\/table><\/div><p>After only 2 hours in the marinade, the eggs are paler and seasoned mostly at the edge. The chicken is seasoned less deeply, and the stock is a little lighter.<\/p><p><strong>Elevated<\/strong> (two days): the timeline below.<\/p><p><em>Why elevated tastes deeper:<\/em> overnight, the eggs turn deep amber and the yolk itself takes on the seasoning, the soy works right through the chicken, and the cold soak draws more from the kombu and shiitake without any bitterness.<\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>Day 1, any time<\/td><td>Shop.<\/td><\/tr><tr><td>Day 1, evening (40 min)<\/td><td>Soak the kombu and shiitake in the stock (step 1). Marinate the chicken (step 2). Boil, peel and marinate the eggs (step 3).<\/td><\/tr><tr><td>Day 2, 1 h 15 min before eating<\/td><td>Take the eggs and chicken out of the fridge. Make the broth (steps 4–6).<\/td><\/tr><tr><td>Day 2, 45 min before<\/td><td>Fry the chicken, then the pak choi (steps 7–9).<\/td><\/tr><tr><td>Day 2, 15 min before<\/td><td>Finish the broth, cook the noodles, assemble (steps 10–13).<\/td><\/tr><\/tbody><\/table><\/div>"}, {"name": "Leftovers", "html": "<ul><li><strong>Broth:<\/strong> keeps 4 days in the fridge, or 3 months frozen. Reheat it gently, without boiling.<\/li><li><strong>Eggs:<\/strong> keep up to 3 days in their marinade. They get firmer and saltier each day. The marinade can be used once more for a fresh batch within a week.<\/li><li><strong>Chicken:<\/strong> keeps 3 days. Re-crisp it skin-side down in a dry pan over a medium heat before slicing.<\/li><li><strong>Noodles:<\/strong> never store them in the broth; they swell and go soft. Cook them fresh each time.<\/li><\/ul><p><strong>What to turn it into<\/strong><\/p><ul><li><strong>Chicken and egg rice bowl:<\/strong> hot rice, re-crisped chicken, a halved soy egg, pak choi, chilli crisp and spring onion, with a few spoonfuls of broth simmered down into a glossy sauce.<\/li><li><strong>Fried rice:<\/strong> day-old rice fried hard with diced chicken, chopped soy egg, spring onion and a spoon of chilli crisp.<\/li><li><strong>Dumpling soup:<\/strong> the leftover broth with shop-bought gyoza simmered in it, topped with spring onion and chilli crisp. Ten minutes.<\/li><li><strong>Miso loaded fries:<\/strong> fries topped with crisped chicken, a drizzle of the broth reduced to a sauce, chilli crisp, spring onion and Japanese mayonnaise.<\/li><\/ul>"}, {"name": "Notes", "html": "<ul><li><strong>Boning a thigh:<\/strong> lay it skin-side down. Run a small sharp knife along both sides of the bone, cut underneath it, then cut it free at the knuckle. It takes about a minute each.<\/li><li><strong>Heat:<\/strong> 1 tbsp doubanjiang gives a warm background heat, and the chilli crisp adds the rest. For real heat, use 2 tbsp and a pinch of ground Sichuan pepper.<\/li><li><strong>Smooth broth:<\/strong> strain it after step 6, before adding the miso.<\/li><li><strong>Sweetcorn:<\/strong> loose kernels are the classic Sapporo topping, but they spread through every spoonful. Keep the corn in one piece instead: miso-butter corn ribs (quartered cobs, brushed with miso butter and charred) on the side or laid across the bowl.<\/li><\/ul>"}]}, {"slug": "spatchcock-chicken-kettle", "title": "Spatchcock chicken on the Weber", "intro": "A whole chicken, flattened and roasted with the lid on over a two-zone charcoal fire. It comes out with crisp, golden skin, juicy meat and a light smoke, and the breast and legs finish at the same time.", "kind": "American", "line": "A whole chicken roasted over charcoal, with crisp golden skin.", "time": "About 3½ hours", "serves": "Serves 4", "base": 4, "unit": "people", "groups": [{"name": "The chicken", "items": ["1 whole chicken, 1.6–2 kg (free-range if you can; the skin crisps better)", "Fine sea salt: 1% of the chicken's weight (about 18 g for 1.8 kg)", "1 tsp baking powder (<em>powder<\/em>, not bicarbonate of soda)", "Freshly ground black pepper", "1 tbsp neutral oil"]}, {"name": "Herb butter (optional, but good)", "items": ["40 g soft butter", "2 garlic cloves, grated", "Leaves from 3 sprigs thyme, chopped", "Zest of 1 lemon (keep the lemon)"]}, {"name": "To finish", "items": ["The zested lemon, halved", "Flaky salt"]}], "steps": [{"n": 1, "phase": "Ahead of time", "title": "Spatchcock the chicken", "text": "<p>Put it breast-side down. Cut along both sides of the backbone with the scissors and lift it out (freeze it for stock). Turn the bird over, open it out like a book, and press down hard on the breastbone with the heel of your hand until it cracks and the chicken lies flat.<\/p>", "why": "<p>A whole chicken is uneven, with thick legs and a breast that dries out first. Flattened, it's one even thickness, so everything finishes together, and it cooks in under an hour instead of an hour and a half. More of the skin faces the heat, so more of it crisps.<\/p>"}, {"n": 2, "phase": "Ahead of time", "title": "Dry-brine it", "text": "<p>Mix the salt, baking powder and a good grind of pepper. Pat the chicken dry, then sprinkle the mix evenly over both sides, mostly on the skin. Leave it uncovered on a rack or plate in the fridge <strong>overnight<\/strong> (12–24 h), or for at least 2 hours.<\/p>", "why": "<p>As with the beef cheeks, salt given time seasons the meat all the way through and helps it hold on to its juices. Uncovered in the fridge, the skin dries, and dry skin crisps where wet skin steams. The baking powder makes the skin slightly alkaline, which helps it brown faster and blister into crackly bubbles.<\/p>"}, {"n": 3, "phase": "Ahead of time", "title": "If using the herb butter", "text": "<p>If using the herb butter: mix the butter, garlic, thyme and lemon zest. Just before cooking, slide your fingers under the breast skin to loosen it, and push the butter in, spreading it over the breast meat.<\/p>", "why": "<p>The breast is the leanest part and the first to dry out. Butter under the skin bastes it from inside as it melts, and keeps the flavour against the meat. It goes <em>under<\/em> the skin, not on top, so it doesn't stop the skin crisping.<\/p>"}, {"n": 4, "phase": "Setting up the grill", "title": "Light a full chimney of briquettes", "text": "<p>Stand the chimney on the charcoal grate, fill it with briquettes, and light it underneath with a couple of firelighters. Wait <strong>15–20 minutes<\/strong>, until the top briquettes are covered in grey ash.<\/p>", "why": "<p>The chimney lights the coals evenly without lighter fluid, which can leave a chemical taste. Grey ash means the coals are fully alight and the heat is steady. Put the chicken on too early and the temperature keeps climbing.<\/p>"}, {"n": 5, "phase": "Setting up the grill", "title": "Make two zones", "text": "<p>Tip the coals onto <strong>one side<\/strong> of the charcoal grate and pile them up. Put the foil tray on the empty side, then put the cooking grate back on. If you're using the wood chunk, put it on the coals now.<\/p>", "why": "<p>This is the trick that turns a kettle into an oven. The chicken sits over the empty side, cooked by hot air moving under the lid, not by flame. The tray catches dripping fat, so it can't flare up and scorch the bird.<\/p>"}, {"n": 6, "phase": "Setting up the grill", "title": "Set the vents and heat the grate", "text": "<p>Bottom vent <strong>fully open<\/strong>. Lid on, with the lid vent <strong>half open<\/strong> and turned so it sits over the empty side, opposite the coals. Leave it for 10 minutes to heat up. Aim for <strong>190–200 °C<\/strong> under the lid. With no lid thermometer, push the probe through the lid vent for a couple of minutes to read it.<\/p>", "why": "<p>Air comes in at the bottom, feeds the coals, and leaves through the lid vent. With the vent over the chicken, the hot air and smoke are drawn across the bird on their way out. More open = hotter; more closed = cooler. Change one vent a little at a time and give it 10 minutes to settle.<\/p>"}, {"n": 7, "phase": "Cooking", "title": "Clean and oil the grate", "text": "<p>, then put the chicken on the empty side, <strong>skin-side up, legs pointing towards the coals<\/strong>. Rub the skin lightly with the oil. Push the probe into the thickest part of the breast, not touching bone. Lid on.<\/p>", "why": "<p>The legs need to reach a higher temperature than the breast, so they face the heat. Oil helps the skin brown evenly.<\/p>"}, {"n": 8, "phase": "Cooking", "title": "Leave it alone for 25 minutes", "text": "<p>Don't lift the lid.<\/p>", "why": "<p>Every time the lid opens, the heat escapes and it takes several minutes to recover. Cooking with the lid on is what makes this work.<\/p>"}, {"n": 9, "phase": "Cooking", "title": "At 25 minutes, have a look", "text": "<p>If one side is browning faster, turn the bird round, but keep the legs nearer the coals. Check the temperature under the lid again: if it's dropped below 170 °C (wind does this), open the lid vent a little more.<\/p>", "why": ""}, {"n": 10, "phase": "Cooking", "title": "It's done when the breast reads 68 °C and the thick part of the thigh reads 78–80 °C", "text": "<p>It's done when the breast reads 68 °C and the thick part of the thigh reads 78–80 °C, usually 45–60 minutes in total.<\/p>", "why": "<p>Breast meat is juiciest just under 70 °C, and it climbs a couple more degrees while it rests. Thigh meat is tougher and needs 78–80 °C before it turns tender. Spatchcocking is what lets both reach their right temperature at the same time.<\/p>"}, {"n": 11, "phase": "Cooking", "title": "Optional", "text": "<p>Optional, for extra crisp skin: in the last 2–3 minutes, move the chicken skin-side down over the coals. Stay with it and watch closely; it can go from golden to burnt in under a minute. Grill the lemon halves cut-side down over the coals at the same time.<\/p>", "why": ""}, {"n": 12, "phase": "Resting and carving", "title": "Rest it for 10–15 minutes", "text": "<p>, uncovered or very loosely tented with foil.<\/p>", "why": "<p>The juices settle back into the meat instead of running onto the board. Wrapping it tightly would steam the skin soft again.<\/p>"}, {"n": 13, "phase": "Resting and carving", "title": "Carve", "text": "<p>Cut off the legs and separate the thighs and drumsticks at the joint. Cut each breast away from the bone in one piece, then slice it thickly across. Squeeze over the grilled lemon and scatter with flaky salt.<\/p>", "why": ""}], "extras": [{"name": "Versions", "html": "<p><strong>Standard<\/strong> (about 3½ hours)<\/p><div class=\"tbl\"><table><thead><tr><th>From start<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>0:00<\/td><td>Spatchcock and dry-brine the chicken; leave uncovered in the fridge (steps 1–2). Make the herb butter (step 3).<\/td><\/tr><tr><td>1:30<\/td><td>Light the chimney (step 4).<\/td><\/tr><tr><td>1:50<\/td><td>Set up two zones and the vents; heat the grill (steps 5–6).<\/td><\/tr><tr><td>2:00<\/td><td>Butter under the skin; chicken on (step 7).<\/td><\/tr><tr><td>2:45–3:00<\/td><td>Done? Rest (steps 10–12). Grill sides while it rests.<\/td><\/tr><tr><td>3:15<\/td><td>Carve and serve (step 13).<\/td><\/tr><\/tbody><\/table><\/div><p>The skin crisps a little less after only 2 hours of salting, and the seasoning stays nearer the surface.<\/p><p><strong>Elevated<\/strong> (two days)<\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Do<\/th><\/tr><\/thead><tbody><tr><td>Day 1, evening (20 min)<\/td><td>Spatchcock and dry-brine overnight, uncovered (steps 1–2). Make the herb butter and refrigerate it; take it out an hour before using.<\/td><\/tr><tr><td>Day 2<\/td><td>As the standard version from lighting the chimney, <strong>with the wood chunk<\/strong> on the coals for smoke.<\/td><\/tr><\/tbody><\/table><\/div><p><em>Why elevated tastes better:<\/em> overnight, the salt seasons the meat right through and the skin dries out completely, so it crisps and blisters properly. The herb butter's garlic and lemon soften into the butter overnight. The wood adds a light smoke the standard version goes without.<\/p>"}, {"name": "Serving", "html": "<p>While the chicken rests, the coals are still hot. Use them:<\/p><ul><li><strong>Flatbreads<\/strong>, a minute or two a side over the coals.<\/li><li><strong>Corn on the cob, peppers or courgettes<\/strong>, straight over the coals.<\/li><li><strong>A sauce:<\/strong> garlic yoghurt (yoghurt, a grated garlic clove, lemon juice, salt) or salsa verde (parsley, capers, mustard, vinegar, olive oil).<\/li><\/ul>"}, {"name": "Leftovers", "html": "<ul><li><strong>Keeps<\/strong> 3 days in the fridge. Pull the meat off the bone before storing it; it's much easier while it's still warm.<\/li><li><strong>Re-crisp<\/strong> the skin and meat in a hot, dry pan before using.<\/li><li><strong>Carcass:<\/strong> keep it for stock, which picks up the smoke.<\/li><li><strong>What to make:<\/strong> chicken and herb salad with the grilled lemon squeezed over; flatbread wraps with garlic yoghurt; a toasted sandwich with mayonnaise and crisp skin; fried rice.<\/li><\/ul>"}, {"name": "Notes", "html": "<ul><li><strong>Cold or windy days:<\/strong> the kettle runs cooler, so expect the longer end of the timing. Keep the lid shut and put the grill out of the wind if you can.<\/li><li><strong>Smaller 47 cm kettle:<\/strong> use about three-quarters of a chimney.<\/li><li><strong>Lumpwood charcoal<\/strong> burns hotter and faster than briquettes: use about three-quarters of a chimney and check the temperature more often.<\/li><li><strong>Afterwards:<\/strong> close both vents fully to put the coals out. Ash stays hot for up to two days, so let it cool completely before emptying it.<\/li><\/ul>"}]}, {"slug": "pumpkin-spice-syrup", "title": "Pumpkin spice syrup (and the latte)", "intro": "A thick, deeply spiced syrup made with real pumpkin, brown sugar and whole spices. Make a bottle once, then a pumpkin spice latte takes as long as your coffee does. It's richer and spicier than café versions.", "kind": "American", "line": "A spiced syrup made with real pumpkin, for lattes in minutes.", "time": "About 1 hour", "serves": "Makes 350 ml", "base": 10, "unit": "lattes", "groups": [{"name": "For the syrup", "items": ["1 tin pumpkin purée (425 g; you need about 120 g). Libby's is the usual one, in the baking aisle of bigger supermarkets. Or see the notes for using butternut squash.", "100 g light brown soft sugar", "50 g dark muscovado sugar", "2 cinnamon sticks", "4 whole cloves", "4 allspice berries", "A thumb of fresh ginger (about 3 cm)", "1 whole nutmeg", "3 black peppercorns", "Vanilla extract", "Fine salt"]}, {"name": "For the lattes", "items": ["Coffee: espresso, or strong coffee from a moka pot, AeroPress or cafetière", "Whole milk (or a \"barista\" oat milk, which froths properly)", "Optional: whipping cream and ground cinnamon, for the top"]}], "steps": [{"n": 1, "phase": "The syrup", "title": "Toast the whole spices", "text": "<p>Put the cinnamon sticks, cloves, allspice and peppercorns in the dry saucepan over a medium heat for 1–2 minutes, shaking the pan, until you can smell them.<\/p>", "why": "<p>Heat wakes up the oils inside whole spices, and that's where their flavour lives. Toasted spices taste deeper and warmer; untoasted ones taste flat and dusty.<\/p>"}, {"n": 2, "phase": "The syrup", "title": "Add 200 ml water, both sugars and the ginger", "text": "<p>(sliced into coins, no need to peel). Bring to a simmer, stirring until the sugar dissolves, and simmer for 5 minutes.<\/p>", "why": "<p>The light brown sugar sweetens; the dark muscovado adds a deep, toffee-like, almost treacly note, which is what makes this taste richer than a café syrup. Five minutes in hot syrup draws the flavour out of the spices.<\/p>"}, {"n": 3, "phase": "The syrup", "title": "Whisk in 120 g of the pumpkin purée", "text": "<p>Whisk in 120 g of the pumpkin purée and grate in about a quarter of the nutmeg (½ tsp). Simmer gently for 10 minutes, stirring now and then so it doesn't catch.<\/p>", "why": "<p>The pumpkin gives body and a soft, earthy sweetness, and cooking it takes away its raw, vegetable taste. Nutmeg goes in now rather than at the start because it fades if it's boiled for long.<\/p>"}, {"n": 4, "phase": "The syrup", "title": "Take it off the heat and leave it to steep for 30 minutes", "text": "", "why": "<p>The spices keep giving flavour as it cools. Leave it longer, up to a couple of hours, for a stronger syrup.<\/p>"}, {"n": 5, "phase": "The syrup", "title": "Strain it through the fine sieve", "text": "<p>Strain it through the fine sieve into a jug. Press gently with a spoon to get the pumpkin through, but don't scrape the bottom of the sieve hard.<\/p>", "why": "<p>The spices and ginger come out, but most of the pumpkin goes through, and that's what makes the syrup thick and velvety. Scraping hard pushes through the grainy bits.<\/p>"}, {"n": 6, "phase": "The syrup", "title": "Stir in 1 tsp vanilla and a small pinch of salt", "text": "<p>Pour it into the bottle and keep it in the fridge.<\/p>", "why": "<p>Vanilla rounds the spices off. The salt is too little to taste, but it makes the sweetness taste fuller and the spices sharper, as it does in salted caramel.<\/p>"}, {"n": 7, "phase": "The latte", "title": "Make a double espresso", "text": "<p>(or about 100 ml of strong coffee) into your mug.<\/p>", "why": ""}, {"n": 8, "phase": "The latte", "title": "Stir 2–3 tbsp (30–45 ml) of syrup into the hot coffee", "text": "<p>Shake the bottle first, because the pumpkin settles.<\/p>", "why": "<p>Syrup dissolves easily in hot coffee but sinks to the bottom of milk. Mixing it into the coffee first means every sip is flavoured.<\/p>"}, {"n": 9, "phase": "The latte", "title": "Heat and froth about 200 ml of milk", "text": "<p>Heat and froth about 200 ml of milk until it's hot but not boiling (around 60–65 °C, when the jug is too hot to hold for more than a second).<\/p><ul><li><strong>With a frother:<\/strong> as normal.<\/li><li><strong>Without one:<\/strong> heat the milk, pour it into a jar no more than half full, put the lid on tightly, wrap it in a tea towel, and shake hard for 30 seconds.<\/li><\/ul>", "why": "<p>Past about 70 °C milk starts to taste cooked, and its sweetness drops away.<\/p>"}, {"n": 10, "phase": "The latte", "title": "Pour the milk over the coffee", "text": "<p>, holding back the foam with a spoon, then spoon the foam on top.<\/p>", "why": ""}, {"n": 11, "phase": "The latte", "title": "Optional top", "text": "<p>Optional top: whipped cream with a spoonful of the syrup whisked into it, then a pinch of cinnamon or a grating of nutmeg. A few flakes of sea salt on the cream are worth trying: the salty edge against the sweet spice is a lovely contrast.<\/p><p><strong>Iced version:<\/strong> syrup and cold milk stirred together, ice, then a shot of espresso poured over the top.<\/p>", "why": ""}], "extras": [{"name": "Versions", "html": "<p><strong>Standard<\/strong> (about 1 hour): make the syrup (steps 1–6), steeping for 30 minutes, and it's ready to use.<\/p><p><strong>Elevated<\/strong> (overnight): at step 4, steep for 2 hours, then refrigerate the syrup overnight <strong>with the spices still in it<\/strong>. Strain it the next morning (step 5) and finish it (step 6). <em>Why:<\/em> the spices go on giving flavour as the syrup sits cold, so it comes out stronger and rounder, with the clove and allspice settled into the background rather than standing out.<\/p>"}, {"name": "Leftovers", "html": "<ul><li><strong>Fridge:<\/strong> 10 days, in a sealed bottle. The pumpkin is what limits it. If it smells sour or fizzes, throw it away.<\/li><li><strong>Freezer:<\/strong> pour it into an ice-cube tray. Each cube is about one latte's worth (30–45 ml in most trays), and it melts straight into hot coffee. It keeps for 3 months.<\/li><li><strong>The rest of the tin of pumpkin:<\/strong> it freezes well too. Or make a second batch of syrup and freeze it.<\/li><\/ul><p><strong>Other uses for the syrup<\/strong><\/p><ul><li>Stirred into <strong>hot chocolate<\/strong>, <strong>chai<\/strong> or plain <strong>black tea<\/strong>.<\/li><li>Drizzled over <strong>porridge<\/strong>, <strong>Greek yoghurt<\/strong>, <strong>pancakes<\/strong> or <strong>French toast<\/strong>.<\/li><li>Whisked into <strong>whipped cream<\/strong> for any autumn pudding.<\/li><li>A spoonful in <strong>overnight oats<\/strong>.<\/li><li>In a <strong>cocktail<\/strong>: 50 ml bourbon, 15 ml syrup and 2 dashes of bitters, stirred over ice. A pumpkin old fashioned.<\/li><li>Brushed over <strong>roasted squash or carrots<\/strong> in the last 10 minutes as a glaze.<\/li><\/ul>"}, {"name": "Notes", "html": "<ul><li><strong>Stronger:<\/strong> steep for 2 hours, or add a third cinnamon stick.<\/li><li><strong>No whole spices?<\/strong> UK \"mixed spice\" is almost the same blend as American pumpkin pie spice. Use 2 tsp of it in place of the whole spices and nutmeg, added with the pumpkin. The flavour is a little flatter, and some fine grit settles at the bottom of the bottle.<\/li><li><strong>No pumpkin?<\/strong> Roast about 300 g of butternut squash at 200 °C fan until soft (about 40 minutes), then blend it until smooth. It's sweeter than tinned pumpkin and works just as well.<\/li><li><strong>Spice-only syrup, no pumpkin at all:<\/strong> follow the same steps without the purée. It's thinner and clearer, and it keeps for 3–4 weeks.<\/li><\/ul>"}]}];
const PAGES = {"privacy": {"title": "Privacy policy", "html": "<p>Last updated 12 November 2026<\/p><p>MoufCooks (cooking.mouftools.com) is a family recipe book. It is run by Enkefalos Holdings Ltd (\"Enkefalos\"), who are responsible for your data under UK data protection law. Questions, or requests about your data: <a href=\"mailto:lemma@enkefalos.co.uk\">lemma@enkefalos.co.uk<\/a>.<\/p><h2>In short<\/h2><ul><li>No sign-in, no accounts, no adverts, no tracking, no analytics, no cookies.<\/li><li>The site never asks for your name, your email address or anything else about you.<\/li><li>A few settings are kept in your own browser so the site remembers them. They never leave your device.<\/li><\/ul><h2>What is kept in your browser<\/h2><p>So that the site is as you left it, your browser keeps:<\/p><ul><li>whether you chose the light or the dark look;<\/li><li>whether you chose the standard or the elevated version;<\/li><li>the number of people you set for a recipe;<\/li><li>the ingredients you have ticked off;<\/li><li>the page you last reached in a recipe, for six hours, so you can pick up where you left off.<\/li><\/ul><p>This is kept in your browser's own storage, not in cookies. It is not sent to us or to anyone else. To remove it, clear this site's data in your browser's settings.<\/p><h2>What others receive when you visit<\/h2><p>To show you a page, your device has to ask other computers for it, as it does for any website.<\/p><ul><li><strong>Vercel<\/strong> hosts the site. It receives your IP address and details of your browser and device, and keeps logs so it can deliver the site and keep it secure. Vercel does this on our behalf. It is based in the United States. See <a href=\"https://vercel.com/legal/privacy-policy\" target=\"_blank\" rel=\"noopener\">Vercel&#x27;s privacy notice<\/a>.<\/li><li><strong>Google Fonts<\/strong> supplies the lettering. When a page loads, Google receives your IP address and details of your browser. Google says it sets no cookie y is yours to look after.<\/strong> Cook meat, poultry and eggs safely, and store and reheat leftovers safely. Some recipes use soft-boiled eggs.<\/li><li><strong>Take care.<\/strong> Sharp knives, hot fat, boiling liquid, charcoal and fire can all hurt you. Follow the instructions that came with your own equipment.<\/li><li><strong>Allergies.<\/strong> The recipes do not list allergens. If you cook for someone with an allergy or an intolerance, check the label of every ingredient.<\/li><li><strong>Not advice.<\/strong> Nothing here is medical, dietary or nutritional advice.<\/li><li><strong>Changing the number of people.<\/strong> The site works out new amounts by arithmetic. It does not change cooking times, pan sizes or oven temperatures. Check that the amounts make sense before you cook.<\/li><\/ul><h2>Using the recipes<\/h2><p>The words and pictures belong to the family members who made them. You are welcome to cook from them, print them and share a link. Please do not republish or sell them without asking first.<\/p><h2>No guarantees<\/h2><p>The site is offered as it is. It may contain mistakes, it may change, and it may not always be available. As far as the law allows, we are not responsible for any loss or damage that comes from using the site or cooking from it.<\/p><p>Nothing in these terms limits any responsibility that the law does not allow to be limited, such as for death or personal injury caused by negligence, or for fraud.<\/p><h2>Changes<\/h2><p>These terms may change. The date at the top shows when they last did. If you keep using the site after a change, the new terms apply.<\/p><h2>Law<\/h2><p>These terms are governed by the law of England and Wales, and its courts decide any dispute. If you live in Scotland or Northern Ireland, you can also use the courts there.<\/p><h2>Contact<\/h2><p><a href=\"mailto:lemma@enkefalos.co.uk\">lemma@enkefalos.co.uk<\/a><\/p><p>Enkefalos Holdings Ltd is a company registered in England and Wales, company number 1     out.push({ label: `Step ${s.n} of ${r.steps.length}`, phase: s.phase, name: s.title, html: `<div class="steppage ${media ? "media" : ""}">
      <div class="main"><div class="head"><div class="num" aria-hidden="true">${s.n}</div></div><h1>${s.title}</h1><div class="prose">${scale(s.text, f)}</div>${why}</div>
      ${media ? `<div class="side">${media}</div>` : ""}
      ${s.why ? `<div class="whydrop" id="why"><div class="why"><div class="prose">${scale(s.why, f)}</div></div></div>` : ""}</div>` });
  });
  if (r.extras.length) out.push({ label: "More", name: "More about this recipe", html: `<div class="more"><h1>More about this recipe</h1>${r.extras.map((x) => `<details><summary>${x.name}${I.chev}</summary><div class="prose">${scale(x.html, f)}</div></details>`).join("")}</div>` });
  return out;
}
function at(r, n) {
  if (n != null) { store.set("at-" + r.slug, { i: n, t: Date.now() }); return n; }
  const s = store.get("at-" + r.slug, null);
  return s && Date.now() - s.t < 6 * 3600e3 ? s.i : 0;   // pick up where you left off, for six hours
}
function book(r) {
  const ps = pages(r), i = Math.min(at(r), ps.length - 1), p = ps[i], next = ps[i + 1];
  return `<div class="book">
    <div class="wrap"><div class="bar"><a href="#home">${I.bwd}All recipes</a><span class="t">${r.title}</span>${themeBtn()}</div>
      <div class="prog"><div class="lbl"><span>${p.label}</span>${p.phase ? `<em>${p.phase}</em>` : ""}</div>
        <div class="ticks" aria-hidden="true">${ps.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("")}</div></div></div>
    <div class="stage wrap"><div class="page">${p.html}</div></div>
    <nav class="pager" aria-label="Pages"><div class="wrap">
      <button class="btn ghost" type="button" data-go="-1" ${i === 0 ? "disabled" : ""} aria-label="Previous page">${I.bwd}<span>Back</span></button>
      ${next ? `<button class="btn next" type="button" data-go="1" aria-label="Next page: ${next.name}"><span>${i === 0 ? "Begin" : "Next"}</span><span class="nt">${next.name}</span>${I.fwd}</button>` : `<a class="btn next" href="#home"><span>Finish</span><span class="nt">Back to all recipes</span>${I.fwd}</a>`}
    </div></nav></div>`;
}
// Show only the chosen version's lines where a step gives both.
function applyVersion(root) {
  const v = store.get("version", "same");
  root.querySelectorAll(".prose li").forEach((li) => {
    const m = /^<strong>(Same day|Standard|Elevated):<\/strong>/.exec(li.innerHTML.trim());
    if (m) li.toggleAttribute("data-hide", (m[1] === "Elevated") !== (v === "elevated"));
  });
}

function route() {
  const m = /^(?:recipe|cook)-(.+)$/.exec(location.hash.slice(1));
  const r = m && bySlug(m[1]);
  if (r) return { view: "recipe", r };
  const d = PAGES[location.hash.slice(1)];
  return d ? { view: "doc", d } : { view: "home" };
}
function render() {
  const { view, r, d } = route();
  app.innerHTML = view === "home" ? home() : view === "doc" ? docPage(d) : book(r);
  if (view === "recipe") { applyVersion(app); keepAwake(); } else letSleep();
  document.title = view === "home" ? "MoufCooks" : view === "doc" ? d.title + " · MoufCooks" : r.title;
}
function change(fn, dir) {
  if (!document.startViewTransition || reduce.matches) { fn(); return; }
  if (dir) document.documentElement.dataset.dir = dir;
  document.startViewTransition(fn).finished.finally(() => { delete document.documentElement.dataset.dir; });
}
async function keepAwake() {
  try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
}
function letSleep() { if (wake) { wake.release().catch(() => {}); wake = null; } }
// The "why" drops down from its button across the whole page, and stops at the bottom of the screen.
function toggleWhy(open) {
  const btn = app.querySelector(".whybtn"), drop = document.getElementById("why");
  if (!btn || !drop || open === drop.classList.contains("open")) return;
  btn.setAttribute("aria-expanded", open);
  if (open) {
    const room = app.querySelector(".stage").getBoundingClientRect().bottom - btn.getBoundingClientRect().bottom - 20;
    let top = btn.offsetTop + btn.offsetHeight + 10, el = btn.offsetParent;
    while (el && !el.classList.contains("steppage")) { top += el.offsetTop; el = el.offsetParent; }
    drop.style.top = top + "px";
    drop.style.maxHeight = Math.max(room, 180) + "px";
  } else drop.style.maxHeight = "";
  drop.classList.toggle("open", open);
}
function turn(d) {
  const { view, r } = route();
  if (view !== "recipe") return;
  const i = Math.min(at(r), pages(r).length - 1), n = Math.min(Math.max(i + d, 0), pages(r).length - 1);
  if (n === i) return;
  at(r, n);
  change(() => { render(); const st = app.querySelector(".stage");  }, d < 0 ? "back" : "fwd");
}
function setPeople(r, p) {
  const [min, max] = range(r);
  p = Math.min(Math.max(p, min), max);
  if (p === people(r)) return;
  store.set("people-" + r.slug, p);
  const box = app.querySelector(".serv");
  if (!box) return;
  const b = box.querySelector("b"), input = box.querySelector("input");
  b.textContent = p; b.classList.remove("tick"); void b.offsetWidth; b.classList.add("tick");
  input.value = p; input.style.setProperty("--fill", ((p - min) / (max - min)) * 100 + "%");
  box.querySelector(".note").textContent = p === r.base ? "As the recipe is written." : "Amounts are reworked for you. Cooking times stay the same.";
  const list = app.querySelector(".needcols");
  if (list) list.innerHTML = needList(r, list.dataset.part.split(",").map(Number));
}

let lastView = route().view;
addEventListener("hashchange", () => {
  const next = route();
  if (lastView === "home") homeScroll = scrollY;
  change(() => { render(); scrollTo(0, next.view === "home" ? homeScroll : 0); });
  lastView = next.view;
});
app.addEventListener("click", (e) => {
  if (e.target.closest("[data-theme-toggle]")) {
    const next = theme() === "dark" ? "light" : "dark";
    change(() => { document.documentElement.dataset.theme = next; store.set("theme", next); app.querySelectorAll("[data-theme-toggle]").forEach((b) => { b.outerHTML = themeBtn(); }); });
    return;
  }
  const chip = e.target.closest("[data-kind]");
  if (chip) { kind = chip.dataset.kind; change(render); return; }
  const ver = e.target.closest("[data-ver]");
  if (ver) {
    store.set("version", ver.dataset.ver);
    const seg = ver.closest(".seg");
    seg.dataset.v = ver.dataset.ver;
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === ver));
    return;
  }
  const pm = e.target.closest("[data-pm]");
  if (pm) { const { r } = route(); setPeople(r, people(r) + +pm.dataset.pm * range(r)[2]); return; }
  const go = e.target.closest("[data-go]");
  if (go) { turn(+go.dataset.go); return; }
  const why = e.target.closest(".whybtn");
  if (why) { toggleWhy(why.getAttribute("aria-expanded") !== "true"); return; }
  if (!e.target.closest(".whydrop")) toggleWhy(false);
});
app.addEventListener("input", (e) => { if (e.target.id === "people") setPeople(route().r, +e.target.value); });
app.addEventListener("change", (e) => {
  if (!e.target.matches(".needcols input")) return;
  const { r } = route();
  const seen = [...app.querySelectorAll(".needcols input")].map((c) => +c.dataset.i);
  const kept = store.get("ticks-" + r.slug, []).filter((i) => !seen.includes(i));
  store.set("ticks-" + r.slug, kept.concat([...app.querySelectorAll(".needcols input:checked")].map((c) => +c.dataset.i)));
});
addEventListener("keydown", (e) => {
  if (e.target.matches && e.target.matches("input[type=range]")) return;
  if (e.key === "Escape") toggleWhy(false);
  else if (e.key === "ArrowRight") turn(1); else if (e.key === "ArrowLeft") turn(-1);
});
let sx = null, sy = 0;
app.addEventListener("pointerdown", (e) => { sx = e.target.closest(".stage") && !e.target.closest("input, button, summary, label") ? e.clientX : null; sy = e.clientY; });
app.addEventListener("pointerup", (e) => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
});
addEventListener("resize", () => { if (route().view === "recipe") render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && route().view === "recipe") keepAwake(); });
render();
</script>

</body>
