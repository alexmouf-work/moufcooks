<title>MoufCooks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Plan. Subject: a family cookbook; reader: a home cook at the hob, phone propped up; job: read and follow a recipe.
   Layout: a deco facade. Symmetric and centred, stepped silhouettes for anything that holds a picture, vertical piers
   beside the name, one sunburst behind the featured photo. That sunburst is the one bold thing; all else is quiet.
   A recipe is a book of pages turned with arrows, never a long scroll.
   Type: Josefin Sans for titles (geometric, like lettering cut into a 1930s building), Literata for reading.
   Colour: oxblood red and brass on warm ivory.
   Motion: calm and premium. One curve, three durations, one drawn-in moment on arrival; the rest answers a tap. */
:root {
  --bg: #FAF6F0; --surface: #FFFFFF; --band: #F4E9DC; --ink: #2F2620; --ink-2: #4A3F36; --muted: #6A5D52;
  --accent: #7A1F2B; --accent-ink: #7A1F2B; --accent-deep: #4A121A; --on-accent: #FFFFFF; --foot-ink: #EBD9D6;
  --brass: #B79A5B; --brass-ink: #765820; --line: #E7DDD0; --photo: #EFE4D6; --photo-ink: #8A7867; --video: #3B332C;
  --shade: 74 50 30;
  --title: "Josefin Sans", "Century Gothic", "Avenir Next", Futura, sans-serif;
  --body: Literata, Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.4, 0, .2, 1); --quick: 160ms; --std: 320ms; --slow: 560ms;
  --s: 14px;
  interpolate-size: allow-keywords;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1E1A16; --surface: #29241F; --band: #25201B; --ink: #F3EEE6; --ink-2: #DCD3C6; --muted: #B5A898;
  --accent: #9B2C3A; --accent-ink: #EAA6AB; --accent-deep: #2B0F13; --on-accent: #FFFFFF; --foot-ink: #DCC7C4;
  --brass: #C9B27C; --brass-ink: #DCC48D; --line: #40382F; --photo: #332C25; --photo-ink: #A39481; --video: #14110E;
  --shade: 0 0 0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1E1A16; --surface: #29241F; --band: #25201B; --ink: #F3EEE6; --ink-2: #DCD3C6; --muted: #B5A898;
  --accent: #9B2C3A; --accent-ink: #EAA6AB; --accent-deep: #2B0F13; --on-accent: #FFFFFF; --foot-ink: #DCC7C4;
  --brass: #C9B27C; --brass-ink: #DCC48D; --line: #40382F; --photo: #332C25; --photo-ink: #A39481; --video: #14110E;
  --shade: 0 0 0; color-scheme: dark }

html { font-size: 100%; }
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.1875rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--accent-ink); }
button { font: inherit; color: inherit; }
em, i { font-style: normal; }
:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 3px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* ---- deco shapes ---- */
.stepped { clip-path: polygon(0 calc(2*var(--s)), var(--s) calc(2*var(--s)), var(--s) var(--s), calc(2*var(--s)) var(--s), calc(2*var(--s)) 0, calc(100% - 2*var(--s)) 0, calc(100% - 2*var(--s)) var(--s), calc(100% - var(--s)) var(--s), calc(100% - var(--s)) calc(2*var(--s)), 100% calc(2*var(--s)), 100% calc(100% - 2*var(--s)), calc(100% - var(--s)) calc(100% - 2*var(--s)), calc(100% - var(--s)) calc(100% - var(--s)), calc(100% - 2*var(--s)) calc(100% - var(--s)), calc(100% - 2*var(--s)) 100%, calc(2*var(--s)) 100%, calc(2*var(--s)) calc(100% - var(--s)), var(--s) calc(100% - var(--s)), var(--s) calc(100% - 2*var(--s)), 0 calc(100% - 2*var(--s))); }
.stepped-top { clip-path: polygon(0 calc(2*var(--s)), var(--s) calc(2*var(--s)), var(--s) var(--s), calc(2*var(--s)) var(--s), calc(2*var(--s)) 0, calc(100% - 2*var(--s)) 0, calc(100% - 2*var(--s)) var(--s), calc(100% - var(--s)) var(--s), calc(100% - var(--s)) calc(2*var(--s)), 100% calc(2*var(--s)), 100% 100%, 0 100%); }
.rule2 { border: 0; height: 5px; border-block: 1px solid var(--brass); margin: 0; }
.orn { color: var(--brass); display: block; }
.orn path { stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: square; }

/* ---- masthead / footer (home) ---- */
.topbar { height: 8px; background: var(--accent); }
.masthead { position: relative; display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vw, 22px); padding-block: 26px 22px; }
.theme { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--brass); background: var(--surface); color: var(--accent-ink); cursor: pointer; transition: background var(--quick) var(--ease), transform var(--quick) var(--ease); }
.theme:hover { background: var(--band); }
.theme:active { transform: scale(.94); }
.theme svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.masthead .theme { position: absolute; top: 50%; right: max(20px, env(safe-area-inset-right, 0px)); transform: translateY(-50%); }
.masthead .theme:active { transform: translateY(-50%) scale(.94); }
@media (max-width: 560px) { .masthead { justify-content: flex-start; } .masthead .orn { display: none; } }
.masthead a { font-family: var(--title); font-weight: 600; font-size: clamp(1.5rem, 5vw, 2.3rem); line-height: 1; padding-top: .18em; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.masthead .orn { flex: none; width: clamp(40px, 10vw, 70px); height: 30px; }
.foot { margin-top: 72px; background: var(--accent-deep); color: #F3EEE6; text-align: center; }
.foot .wrap { padding-block: 38px 44px; display: grid; justify-items: center; gap: 10px; }
.foot .name { font-family: var(--title); font-weight: 600; font-size: 1.4rem; letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; }
.foot .addr { font-size: 1rem; letter-spacing: .06em; color: var(--foot-ink); }
.foot .orn { color: #C9B27C; }
.foot .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; margin-top: 6px; }
.foot .links a { display: inline-flex; align-items: center; min-height: 44px; color: var(--foot-ink); font-size: 1rem; text-underline-offset: .25em; }
.foot .links a:hover { color: #FFFFFF; }
/* ---- plain pages: privacy policy, terms of use ---- */
.doc { max-width: 42em; margin-inline: auto; padding-block: 28px 8px; }
.doc .back { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: var(--title); font-weight: 600; letter-spacing: .04em; text-decoration: none; }
.doc .back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.doc h1 { font-family: var(--title); font-weight: 600; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.1; letter-spacing: .03em; margin: 10px 0 18px; }
.doc .prose { max-width: none; gap: 12px; }
.doc .prose > p:first-child { color: var(--muted); font-size: 1rem; }
.doc h2 { font-family: var(--title); font-weight: 600; font-size: 1.45rem; letter-spacing: .03em; line-height: 1.2; margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--brass); }
.doc a { text-underline-offset: .2em; overflow-wrap: anywhere; }

/* ---- buttons ---- */
.btn { position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: .2em 30px 0; font-family: var(--title); border: 0; background: none; cursor: pointer; text-decoration: none; color: var(--on-accent); font-weight: 600; font-size: 1.25rem; letter-spacing: .02em; transition: transform var(--quick) var(--ease); }
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--accent); clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); transition: filter var(--quick) var(--ease); }
.btn:hover::before { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn svg { flex: none; width: 22px; height: 22px; margin-top: -.2em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }
.btn:hover svg.fwd { transform: translateX(5px); }
.btn:hover svg.bwd { transform: translateX(-5px); }
.btn.ghost { color: var(--accent-ink); }
.btn.ghost::before { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent-ink); clip-path: none; }
.btn[disabled] { opacity: .35; cursor: default; }
.btn[disabled] svg { transform: none !important; }
.chip { min-height: 48px; padding: .2em 22px 0; font-family: var(--title); border: 1.5px solid var(--accent-ink); border-radius: 0; background: var(--surface); color: var(--accent-ink); cursor: pointer; font-size: 1.0625rem; font-weight: 600; letter-spacing: .03em; transition: background var(--std) var(--ease), color var(--std) var(--ease), transform var(--quick) var(--ease); }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---- photo slots ---- */
.ph { display: grid; place-items: center; align-content: center; gap: 8px; aspect-ratio: 4 / 3; max-width: 100%; background-color: var(--photo); color: var(--muted); font-size: 1rem; text-align: center; }
.ph svg { width: 36px; height: 36px; stroke: var(--photo-ink); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ph.video { background-color: var(--video); color: #F3EEE6; }
.ph.video svg { stroke: #F3EEE6; width: 46px; height: 46px; }
.frame { padding: 2px; background: var(--brass); }
.frame > div { padding: 10px; background: var(--surface); }
.lift { filter: drop-shadow(0 14px 16px rgb(var(--shade) / .2)); }

/* ---- home ---- */
.hero { background: var(--band); border-bottom: 1px solid var(--brass); }

.hero .wrap { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 28px 52px; padding-block: 56px; }
.hero .copy { flex: 1 1 380px; min-width: 0; display: grid; gap: 16px; justify-items: start; }
.hero .shot { flex: 1 1 380px; min-width: 0; }
.kind { font-family: var(--title); font-weight: 600; font-size: 1.05rem; letter-spacing: .03em; padding-top: .2em; color: var(--brass-ink); }
h1 { font-family: var(--title); font-weight: 600; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.lede { font-size: 1.3rem; color: var(--ink-2); max-width: 34em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--ink-2); }
.meta span { display: inline-flex; align-items: center; gap: 8px; }
.meta svg { width: 20px; height: 20px; stroke: var(--accent-ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.section-head { display: grid; justify-items: center; gap: 14px; text-align: center; padding-block: 56px 28px; }
.section-head h2 { font-family: var(--title); font-weight: 600; font-size: 2.2rem; line-height: 1.15; letter-spacing: .01em; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-bottom: 36px; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px; }
.grid li { flex: 1 1 300px; max-width: 338px; display: flex; }
.card { flex: 1; display: block; color: var(--ink); text-decoration: none; --s: 12px; filter: drop-shadow(0 10px 12px rgb(var(--shade) / .14)); transition: transform var(--std) var(--ease), filter var(--std) var(--ease); }
.card:hover { transform: translateY(-5px); filter: drop-shadow(0 20px 18px rgb(var(--shade) / .2)); }
.card:active { transform: translateY(-1px) scale(.99); }
.card .frame, .card .frame > div { height: 100%; }
.card .frame > div { padding: 0; display: flex; flex-direction: column; }
.card .body { flex: 1; display: grid; justify-items: center; align-content: start; gap: 10px; padding: 22px 24px 26px; text-align: center; }
.card h3 { font-family: var(--title); font-weight: 600; font-size: 1.6rem; line-height: 1.22; text-wrap: balance; }
.card p { color: var(--ink-2); }
.card .meta { justify-content: center; font-size: 1.0625rem; margin-top: 6px; }
.card .meta svg { width: 18px; height: 18px; }

/* ---- the recipe as a book of pages ---- */
.book { height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.book > .wrap { width: 100%; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 8px; border-bottom: 3px double var(--brass); }
.bar a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding-top: .2em; font-family: var(--title); font-weight: 600; font-size: 1.0625rem; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }
.bar a svg { width: 18px; height: 18px; margin-top: -.2em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }
.bar a:hover svg { transform: translateX(-4px); }
.bar .t { flex: 1; text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--title); font-weight: 600; font-size: 1.15rem; padding-top: .2em; color: var(--muted); }
.prog { padding-block: 12px 4px; display: grid; gap: 8px; }
.prog .lbl { display: flex; flex-wrap: nowrap; white-space: nowrap; justify-content: space-between; gap: 2px 16px; font-weight: 600; color: var(--muted); font-size: 1.0625rem; }
.prog .lbl span { flex: none; }
.prog .lbl em { font-style: normal; font-weight: 400; color: var(--brass-ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ticks { display: flex; gap: 4px; align-items: flex-end; height: 14px; }
.ticks i { flex: 1; height: 6px; background: var(--line); transition: background var(--std) var(--ease), height var(--std) var(--ease); }
.ticks i.done { background: var(--accent); }
.ticks i.now { background: var(--brass); height: 14px; }
.stage { view-transition-name: bookpage; flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr); touch-action: pan-y; }
/* Every page of a recipe is the same box: the full stage. A page that holds more than fits scrolls inside it. */
.page { align-self: stretch; height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; width: 100%; max-width: 1080px; margin-inline: auto; padding-block: 20px 28px; }
.pager { background: var(--surface); border-top: 1px solid var(--brass); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.pager .wrap { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.pager .btn { min-height: 62px; font-size: 1.3rem; }
.pager .next { justify-content: space-between; text-align: left; }
.pager .next .nt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--body); font-weight: 400; font-size: 1.0625rem; letter-spacing: 0; text-transform: none; opacity: .9; padding-bottom: .2em; }
@media (max-width: 640px) { .pager .wrap { grid-template-columns: 1fr 1fr; } .pager .next .nt { display: none; } .pager .next { justify-content: center; } }

.cover { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 52px; }
.cover .copy { flex: 1 1 400px; min-width: 0; display: grid; gap: 14px; justify-items: start; }
.cover .shot { flex: 1 1 340px; min-width: 0; }
@media (min-width: 641px) and (max-width: 860px) { .cover .shot .ph { aspect-ratio: 5 / 2; } }
@media (max-width: 640px) { .cover { gap: 14px; } .cover .copy { gap: 10px; } .cover .shot { order: -1; } .cover .shot .ph { aspect-ratio: 5 / 2; } .cover .frame > div { padding: 6px; } .cover h1 { font-size: 2.1rem; } .cover .orn { display: none; } .lede { font-size: 1.1rem; line-height: 1.5; } .serv .note { display: none; } .steppage { gap: 14px; } .steppage { display: flex; flex-direction: column; } .steppage .side { order: -1; } .num { width: 46px; height: 46px; font-size: 1.35rem; } .page { padding-block: 12px 16px; } }
.serv { display: grid; gap: 6px; width: min(100%, 420px); padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--brass); }
.serv .lbl { display: flex; align-items: baseline; gap: 10px; font-family: var(--title); font-weight: 600; font-size: 1.15rem; padding-top: .2em; }
.serv .lbl b { display: inline-block; min-width: 1.4em; text-align: center; font-size: 2rem; line-height: 1; color: var(--accent-ink); }
.serv .lbl b.tick { animation: pop var(--std) var(--ease); }
@keyframes pop { 0% { transform: translateY(6px); opacity: .2; } 100% { transform: none; opacity: 1; } }
.serv .row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; }
.serv .pm { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--accent-ink); background: var(--surface); color: var(--accent-ink); cursor: pointer; font-family: var(--title); font-size: 1.6rem; line-height: 1; padding-top: .15em; transition: background var(--quick) var(--ease), color var(--quick) var(--ease), transform var(--quick) var(--ease); }
.serv .pm:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.serv .pm:active { transform: scale(.94); }
.serv input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: none; cursor: pointer; --fill: 50%; }
.serv input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: linear-gradient(to right, var(--accent) var(--fill), var(--line) var(--fill)); }
.serv input[type="range"]::-moz-range-track { height: 6px; background: linear-gradient(to right, var(--accent) var(--fill), var(--line) var(--fill)); }
.serv input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -12px; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--brass); transform: rotate(45deg); transition: transform var(--quick) var(--ease); }
.serv input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--brass); border-radius: 0; transform: rotate(45deg); }
.serv input[type="range"]:active::-webkit-slider-thumb { transform: rotate(45deg) scale(1.15); }
.serv .note { font-size: 1rem; color: var(--muted); min-height: 1.6em; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: relative; border: 1.5px solid var(--accent-ink); background: var(--surface); padding: 3px; }
.seg button { position: relative; z-index: 1; min-height: 44px; padding: .2em 22px 0; border: 0; background: none; cursor: pointer; font-family: var(--title); font-size: 1.0625rem; font-weight: 600; letter-spacing: .03em; color: var(--accent-ink); transition: color var(--std) var(--ease); }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--accent); transition: transform var(--std) var(--ease); }
.seg[data-v="elevated"] .thumb { transform: translateX(100%); }

.pagehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 40px; padding-bottom: 18px; }
.pagehead .serv { padding-block: 8px 6px; }
.pagehead .serv .note { display: none; }
.pagehead h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); }
.needcols { columns: 3 270px; column-gap: 44px; }
.needcols > div { padding-bottom: 14px; }
.needcols label { break-inside: avoid; }
.needcols h3 { break-after: avoid; }
.needcols h3 { font-family: var(--title); font-weight: 600; font-size: 1.15rem; letter-spacing: .04em; color: var(--brass-ink); padding: .2em 0 6px; border-bottom: 1px solid var(--brass); margin-bottom: 4px; }
.needcols { font-size: 1.125rem; line-height: 1.45; }
.needcols label { display: flex; gap: 14px; align-items: flex-start; min-height: 44px; padding-block: 5px; cursor: pointer; }
.needcols input { appearance: none; flex: none; width: 24px; height: 24px; margin: 4px 0 0; border: 1.5px solid var(--accent-ink); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background var(--quick) var(--ease); }
.needcols input::after { content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--on-accent); border-bottom: 2.5px solid var(--on-accent); transform: translateY(-1px) rotate(-45deg) scale(0); transition: transform var(--std) var(--ease); }
.needcols input:checked { background: var(--accent); border-color: var(--accent); }
.needcols input:checked::after { transform: translateY(-1px) rotate(-45deg) scale(1); }
.needcols label span { transition: color var(--std) var(--ease), background-size var(--std) var(--ease); background: linear-gradient(currentColor, currentColor) no-repeat 0 55% / 0 1.5px; }
.needcols input:checked + span { color: var(--muted); background-size: 100% 1.5px; }
.needcols .q { font-weight: 600; }

.steppage { position: relative; display: grid; gap: 22px 52px; align-items: start; }
.steppage:not(.media) { max-width: 46em; margin-inline: auto; }
.steppage .head { display: flex; align-items: center; gap: 16px; }
.num { flex: none; width: 56px; height: 56px; display: grid; place-items: center; padding-top: .16em; background: var(--accent); color: var(--on-accent); font-family: var(--title); font-weight: 600; font-size: 1.6rem; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.steppage .main { display: grid; gap: 16px; min-width: 0; }
.steppage h1 { font-size: clamp(1.8rem, 4.4vw, 2.7rem); }
.steppage .main .prose { font-size: clamp(1.25rem, 2vw, 1.4rem); line-height: 1.55; }
.steppage .side { display: grid; gap: 18px; min-width: 0; }
.steppage .side .ph { aspect-ratio: 4 / 3; }
@media (max-width: 640px) { .steppage .side .ph { aspect-ratio: 2 / 1; } }
.prose { display: grid; gap: 10px; max-width: 40em; }
.prose ul { display: grid; gap: 8px; padding-left: 1.2em; list-style: square; }
.prose ol { display: grid; gap: 8px; padding-left: 1.4em; }
.prose li::marker { color: var(--brass); }
.why { background: var(--band); border-block: 1px solid var(--brass); padding: 14px 18px; font-size: 1.125rem; color: var(--ink-2); }
.why .prose { gap: 8px; max-width: none; }
.why strong { color: var(--ink); }
.why h4 { margin: 0 0 4px; font-family: var(--title); font-weight: 600; font-size: 1.05rem; letter-spacing: .08em; color: var(--brass-ink); }
.whybtn { justify-self: start; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: .2em 20px 0; font-family: var(--title); letter-spacing: .03em; border: 1.5px solid var(--accent-ink); background: var(--surface); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
.whybtn svg { margin-top: -.2em; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }
.whybtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--std) var(--ease); }
.fold > div { overflow: hidden; }
.fold.open { grid-template-rows: 1fr; }
@media (min-width: 700px) {
  .page:has(.steppage.media) { display: grid; }
  .steppage.media { grid-template-columns: 1fr 1fr; align-items: stretch; }
  .steppage.media .main { align-self: start; }
  .steppage.media .side .ph { aspect-ratio: auto; height: 100%; min-height: 300px; }
  .page:has(.cover) { display: grid; }
  .cover { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; gap: 0 52px; }
  .cover .copy { align-self: center; }
  .cover .shot, .cover .shot .lift, .cover .shot .frame, .cover .shot .frame > div { height: 100%; }
  .cover .shot .ph { aspect-ratio: auto; height: 100%; min-height: 300px; }
}
.whydrop { position: absolute; left: 0; right: 0; top: 0; z-index: 5; max-height: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--brass); box-shadow: 0 18px 30px rgb(var(--shade) / .28); opacity: 0; visibility: hidden; transform: translateY(-12px); transition: opacity var(--std) var(--ease), transform var(--std) var(--ease), visibility 0s linear var(--std); }
.whydrop.open { overflow: auto; opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.whydrop .why { background: none; border: 0; padding: 18px 24px 22px; font-size: 1.2rem; }
.whydrop .why .prose { max-width: 60em; }
[data-hide] { display: none !important; }

.more { display: grid; gap: 12px; }
.more h1 { justify-self: center; text-align: center; font-size: clamp(1.9rem, 5vw, 2.6rem); }
.more .orn { justify-self: center; margin-bottom: 10px; }
.more details { background: var(--surface); border: 1px solid var(--brass); }
.more summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: .2em 22px 0; cursor: pointer; list-style: none; font-family: var(--title); font-weight: 600; font-size: 1.25rem; }
.more summary::-webkit-details-marker { display: none; }
.more summary svg { flex: none; width: 18px; height: 18px; margin-top: -.2em; stroke: var(--accent-ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--std) var(--ease); }
.more details[open] summary svg { transform: rotate(180deg); }
.more details .prose { padding: 4px 22px 22px; max-width: none; }
.more details::details-content { block-size: 0; overflow: clip; transition: block-size var(--std) var(--ease), content-visibility var(--std) allow-discrete; }
.more details[open]::details-content { block-size: auto; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 1.0625rem; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
.tbl th { font-family: var(--title); font-weight: 600; white-space: nowrap; }
.tbl td:first-child { white-space: nowrap; font-weight: 600; }

/* ---- motion: page changes ---- */
::view-transition-old(root) { animation-duration: 200ms; animation-timing-function: var(--ease); }
::view-transition-new(root) { animation-duration: var(--std); animation-timing-function: var(--ease); }
::view-transition-group(*) { animation-duration: 440ms; animation-timing-function: var(--ease); }
::view-transition-group(bookpage) { animation: none; }
::view-transition-old(bookpage) { animation: out-l 220ms var(--ease) both; }
::view-transition-new(bookpage) { animation: in-r 380ms var(--ease) 60ms both; }
[data-dir="back"]::view-transition-old(bookpage) { animation-name: out-r; }
[data-dir="back"]::view-transition-new(bookpage) { animation-name: in-l; }
@keyframes out-l { to { opacity: 0; transform: translateX(-48px); } }
@keyframes in-r { from { opacity: 0; transform: translateX(64px); } }
@keyframes out-r { to { opacity: 0; transform: translateX(48px); } }
@keyframes in-l { from { opacity: 0; transform: translateX(-64px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}
